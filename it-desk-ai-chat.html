<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IT Service Desk AI</title>
<style>
:root{
  --ac:#2563a8; --ac-l:#eaf1f9; --ok:#15803d; --wa:#b45309; --ng:#b91c1c;
  --tx:#1f2328; --tx2:#5b6672; --tx3:#8b95a1;
  --bg:#f7f8fa; --pn:#fff; --ln:#e4e8ed; --ln2:#eef1f4;
  --mono:"SFMono-Regular",Consolas,"Courier New",monospace;
  --sans:system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--sans);background:var(--bg);color:var(--tx);font-size:13.5px;line-height:1.8;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}

/* header */
.hd{height:52px;background:var(--pn);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:26px;padding:0 22px;position:sticky;top:0;z-index:30}
.hd .nm{font-weight:700;font-size:14px;letter-spacing:.01em;display:flex;align-items:center;gap:9px;white-space:nowrap}
.hd .nm i{width:22px;height:22px;border-radius:6px;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:11px;font-style:normal}
.hd .nm small{font-weight:400;color:var(--tx3);font-size:11px}
.tabs{display:flex;gap:2px;height:100%}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--tx2);padding:0 14px;height:100%;font-size:13px;white-space:nowrap}
.tab:hover{color:var(--tx)}
.tab.on{color:var(--ac);border-bottom-color:var(--ac);font-weight:600}
.hd .rt{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--tx3);white-space:nowrap}
.hd .rt b{color:var(--tx2);font-weight:600}
.hd .av{width:26px;height:26px;border-radius:50%;background:#dbe4ee;color:var(--ac);display:grid;place-items:center;font-size:10px;font-weight:700}

/* chat area */
.wrap{height:calc(100vh - 52px);overflow-y:auto;scroll-behavior:smooth}
.wrap::-webkit-scrollbar{width:10px}
.wrap::-webkit-scrollbar-thumb{background:#d3d9e0;border-radius:5px;border:3px solid var(--bg)}
.chat{max-width:840px;margin:0 auto;padding:26px 24px 240px}
.pane{display:none}.pane.on{display:block}

.intro{text-align:center;padding:44px 0 30px;color:var(--tx2)}
.intro h1{font-size:19px;margin:0 0 8px;color:var(--tx);font-weight:700}
.intro p{margin:0;font-size:12.5px;line-height:1.9}

/* messages */
.u{display:flex;justify-content:flex-end;margin:26px 0 22px}
.u .b{background:var(--ac-l);border:1px solid #d5e3f2;border-radius:12px 12px 3px 12px;padding:10px 14px;max-width:80%}
.u .w{font-size:10.5px;color:var(--tx3);margin-bottom:2px}
.a{display:flex;gap:11px;margin-bottom:24px}
.a>.ic{width:26px;height:26px;border-radius:7px;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:11px;flex:none;margin-top:2px}
.a>.bd{flex:1;min-width:0}
.a p{margin:0 0 10px}
.a p:last-child{margin-bottom:0}

.think{display:flex;align-items:center;gap:8px;color:var(--tx3);font-size:12.5px}
.think i{width:12px;height:12px;border:2px solid #d8dee6;border-top-color:var(--ac);border-radius:50%;animation:sp .7s linear infinite;display:block}
@keyframes sp{to{transform:rotate(360deg)}}
.fade{animation:fi .35s ease both}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* intent line */
.intent{background:var(--pn);border:1px solid var(--ln);border-radius:9px;padding:11px 14px;margin-bottom:12px}
.intent .lb{font-size:10.5px;color:var(--tx3);letter-spacing:.05em}
.intent .th{font-size:14px;font-weight:700;margin:1px 0 6px}
.intent .dm{font-size:13px;font-weight:700;color:#16395c;margin:1px 0 0}
.intent hr{border:0;border-top:1px solid var(--ln2);margin:10px 0}
.dmnote{background:#f4f7fb;border:1px solid #dde7f2;border-radius:7px;padding:8px 11px;font-size:11.5px;color:var(--tx2);margin-top:8px}
.dmnote b{color:#16395c}
.cp{display:inline-block;font-size:11px;padding:1px 8px;border-radius:11px;margin:2px 4px 0 0;background:#f2f5f8;border:1px solid var(--ln);color:var(--tx2)}
.cp.m{background:#eef7f3;border-color:#cde5da;color:#146c4b}
.cp.d{background:#f4f2fa;border-color:#ddd8ee;color:#5a4a8c}

/* candidates */
.cands{border:1px solid var(--ln);border-radius:10px;overflow:hidden;background:var(--pn);margin-bottom:12px}
.cd{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--ln2);cursor:pointer;transition:.12s;text-align:left;width:100%;background:none;border-left:0;border-right:0;border-top:0;align-items:flex-start}
.cd:last-child{border-bottom:0}
.cd:hover{background:#f8fafc}
.cd .no{width:20px;height:20px;border-radius:5px;background:#eef2f6;color:var(--tx2);font-size:10.5px;font-weight:700;display:grid;place-items:center;flex:none;margin-top:2px}
.cd.top .no{background:var(--ac);color:#fff}
.cd .mid{flex:1;min-width:0}
.cd .t1{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cd .pth{font-family:var(--mono);font-size:11px;color:var(--tx2);word-break:break-all;margin-top:1px}
.cd .wy{font-size:11.5px;color:var(--tx2);margin-top:4px;line-height:1.7}
.cd .tr{font-size:10.5px;color:var(--tx3);margin-top:5px;word-break:break-all}
.cd .tr b{color:var(--tx2);font-weight:600}
.cd .rt{flex:none;text-align:right;width:54px;align-self:center}
.cd .go{font-size:11px;color:var(--ac);white-space:nowrap}
.fl{font-size:10px;padding:0 6px;border-radius:4px;border:1px solid;line-height:1.6;font-weight:600}
.fl.ok{color:var(--ok);border-color:#bfe0c9;background:#f1f9f3}
.fl.wa{color:var(--wa);border-color:#ecd9b6;background:#fdf8ee}
.fl.ng{color:var(--ng);border-color:#eecac6;background:#fdf3f2}
.fl.n{color:var(--tx2);border-color:var(--ln);background:#f6f8fa}

/* accordion */
details.acc{border:1px solid var(--ln);border-radius:9px;background:var(--pn);margin-bottom:9px;overflow:hidden}
details.acc>summary{list-style:none;cursor:pointer;padding:9px 13px;font-size:12.5px;color:var(--tx2);display:flex;align-items:center;gap:8px;user-select:none}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary:hover{background:#f8fafc}
details.acc>summary::before{content:"▸";color:var(--tx3);font-size:10px;transition:.15s}
details.acc[open]>summary::before{transform:rotate(90deg)}
details.acc[open]>summary{border-bottom:1px solid var(--ln2);color:var(--tx);font-weight:600}
.accin{padding:13px 15px}
.accin>:first-child{margin-top:0}.accin>:last-child{margin-bottom:0}
.sm{font-size:11px;color:var(--tx3);margin-left:auto;font-weight:400}

/* generic content */
h5.sh{font-size:11px;color:var(--tx3);letter-spacing:.06em;margin:16px 0 6px;font-weight:600}
h5.sh:first-child{margin-top:0}
ul.t{margin:0;padding-left:18px}
ul.t li{margin:5px 0;font-size:12.5px}
dl.kv{display:grid;grid-template-columns:112px 1fr;gap:5px 12px;margin:0;font-size:12.5px}
dl.kv dt{color:var(--tx3);font-size:11.5px}
dl.kv dd{margin:0}
.att{font-family:var(--mono);font-size:10.5px;background:#f4f6f9;border:1px solid var(--ln);padding:0 6px;border-radius:3px;color:var(--tx2);display:inline-block;margin:2px 3px 0 0}
.att.k{background:#fdf8ee;border-color:#ecd9b6;color:var(--wa)}
.note{background:#fdf9f0;border:1px solid #eee0c4;border-left:3px solid var(--wa);border-radius:0 6px 6px 0;padding:9px 12px;font-size:12px;margin:10px 0 0}
pre.code{margin:0;background:#f6f8fa;border:1px solid var(--ln);border-radius:7px;font-family:var(--mono);font-size:11px;line-height:1.75;padding:12px 13px;overflow-x:auto;color:#2a3440}
.k{color:#0550ae;font-weight:600}.k2{color:#7b3fa8}.s{color:#0a7d2f}.c{color:#7a8794;font-style:italic}
.n{color:#0f766e}.r{color:#a1560a}.v{color:#4b5563}
table.tb{width:100%;border-collapse:collapse;font-size:11.5px}
table.tb th{text-align:left;font-weight:600;color:var(--tx3);border-bottom:1px solid var(--ln);padding:6px 7px;font-size:10.5px;white-space:nowrap}
table.tb td{border-bottom:1px solid var(--ln2);padding:6px 7px;color:var(--tx2);vertical-align:top}
table.tb td.m{font-family:var(--mono);font-size:10.5px}
.mono{font-family:var(--mono)}

/* chain / steps */
ul.chain{list-style:none;margin:0;padding:0}
ul.chain li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln2)}
ul.chain li:last-child{border-bottom:0;padding-bottom:0}
.st{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:#fff;flex:none;font-weight:700;margin-top:2px}
.st.ok{background:var(--ok)}.st.ng{background:var(--ng)}.st.wa{background:var(--wa)}
ul.chain b{font-size:12.5px}
ul.chain .lb{font-size:10px;color:var(--tx3);letter-spacing:.05em}
ul.chain p{margin:2px 0 0;font-size:11.5px;color:var(--tx2);line-height:1.7}
code.in{font-family:var(--mono);font-size:11px;background:#f2f5f8;border:1px solid var(--ln2);padding:0 4px;border-radius:3px}

.stp{display:flex;gap:9px;padding:8px 0;border-bottom:1px dashed var(--ln2)}
.stp:last-child{border-bottom:0;padding-bottom:0}
.stp .n2{width:17px;height:17px;border-radius:50%;background:var(--ac);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;flex:none;margin-top:2px}
.stp b{font-size:12px;display:block}
.stp p{margin:1px 0 0;font-size:11.5px;color:var(--tx2);line-height:1.65}
.stp .sc2{font-family:var(--mono);font-size:10px;color:var(--tx3);flex:none;margin-top:2px}

.act{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--ln2)}
.act:last-child{border-bottom:0;padding-bottom:0}
.act .n3{width:19px;height:19px;border-radius:5px;background:var(--ac);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;flex:none;margin-top:3px}
.act b{font-size:12.5px}
.act p{margin:2px 0 0;font-size:12px;color:var(--tx2)}
.act .mt{font-size:10.5px;color:var(--tx3);margin-top:4px;display:flex;gap:14px;flex-wrap:wrap}
.act .mt em{font-style:normal;color:var(--ng);font-weight:600}

/* knowledge graph */
svg.kg{display:block;width:100%;height:auto}
.kg .cap{font-size:8.5px;fill:#9aa4b0}
.kg g.nd{opacity:.15;transition:opacity .4s}
.kg g.nd.on{opacity:1}
.kg g.nd.off{opacity:.24}
.kg g.nd.hit rect{stroke-width:2}
.kg path.eg{fill:none;stroke:#cbd3dc;stroke-width:1.1;opacity:.08;transition:opacity .4s}
.kg path.eg.on{opacity:1}
.kg path.eg.off{opacity:.22}
.kg path.eg.hot{stroke:var(--ac);stroke-width:2.2;opacity:1}
.kg text.l1{font-weight:700}
.kg text.l2{font-size:7.5px;fill:#8b95a1}
.kglg{display:flex;gap:14px;align-items:center;font-size:10.5px;color:var(--tx3);margin-top:6px}
.kglg i{display:inline-block;width:16px;height:0;border-top:2px solid var(--ac);vertical-align:middle;margin-right:4px}
.kglg s{display:inline-block;width:16px;height:0;border-top:1.5px solid #cbd3dc;vertical-align:middle;margin-right:4px}

/* breadcrumb */
.bc{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:0 0 4px}
.bc span{background:var(--ac-l);border:1px solid #cddeef;color:#1b4d7e;font-size:11px;padding:2px 9px;border-radius:12px}
.bc span.last{background:#fdf8ee;border-color:#ecd9b6;color:#8a5a06;font-family:var(--mono);font-size:10.5px}
.bc em{font-style:normal;color:var(--tx3);font-size:10px}

/* drawer */
.ov{position:fixed;inset:0;background:rgba(18,28,42,.3);opacity:0;pointer-events:none;transition:.22s;z-index:55}
.ov.on{opacity:1;pointer-events:auto}
.dw{position:fixed;top:0;right:0;height:100vh;width:min(660px,94vw);background:var(--pn);border-left:1px solid var(--ln);
    box-shadow:-8px 0 28px rgba(20,40,70,.13);transform:translateX(102%);transition:transform .26s cubic-bezier(.4,0,.2,1);
    z-index:60;display:flex;flex-direction:column}
.dw.on{transform:none}
.dwh{padding:14px 18px 12px;border-bottom:1px solid var(--ln);display:flex;gap:12px;align-items:flex-start;flex:none;background:#fbfcfd}
.dwh .t{font-size:15px;font-weight:700;line-height:1.5;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dwh .s{font-family:var(--mono);font-size:11px;color:var(--tx2);margin-top:2px;word-break:break-all}
.dwh .k{font-size:10.5px;color:var(--tx3);letter-spacing:.05em;margin-bottom:2px}
.dwx{margin-left:auto;width:28px;height:28px;border-radius:7px;border:1px solid var(--ln);background:#fff;color:var(--tx2);flex:none;font-size:13px;line-height:1}
.dwx:hover{background:#f1f4f8}
.dwb{flex:1;overflow-y:auto;padding:16px 18px 28px}
.dwb::-webkit-scrollbar{width:9px}
.dwb::-webkit-scrollbar-thumb{background:#d8dee6;border-radius:5px;border:3px solid #fff}
.dwf{flex:none;border-top:1px solid var(--ln);padding:11px 18px;display:flex;gap:8px;background:#fbfcfd}
.dwsc{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--ln);border-radius:8px;padding:8px 12px;margin-bottom:13px}
.dwsc .v2{font-size:19px;font-weight:700;color:var(--ac);font-variant-numeric:tabular-nums;line-height:1}
.dwsc .l3{font-size:10.5px;color:var(--tx3)}
.dwsc .bar{flex:1;margin-top:0}

/* follow-ups + composer */
.fu{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.fub{background:var(--pn);border:1px solid var(--ln);color:var(--ac);padding:5px 12px;border-radius:15px;font-size:12px;transition:.12s}
.fub:hover{background:var(--ac-l);border-color:#c3d8ec}
.btn-p{background:var(--ac);color:#fff;border:1px solid var(--ac);padding:7px 15px;border-radius:7px;font-size:12.5px;font-weight:600}
.btn-p:hover{background:#1d5490}
.btn-s{background:#fff;color:var(--tx2);border:1px solid var(--ln);padding:7px 15px;border-radius:7px;font-size:12.5px}
.btn-s:hover{background:#f2f5f8}
.cmp{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(180deg,rgba(247,248,250,0) 0%,var(--bg) 26%);padding:24px 24px 16px;z-index:20}
.cmpin{max-width:840px;margin:0 auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.chip{background:var(--pn);border:1px solid var(--ln);color:var(--tx2);padding:5px 11px;border-radius:15px;font-size:11.5px;transition:.12s;text-align:left}
.chip:hover{border-color:var(--ac);color:var(--ac)}
.chip b{color:var(--tx3);font-weight:600;font-size:10.5px;margin-right:5px}
.box{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:8px 10px 8px 14px;display:flex;gap:10px;align-items:flex-end;box-shadow:0 2px 10px rgba(20,40,70,.06)}
.box:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px rgba(37,99,168,.1)}
.box textarea{flex:1;border:0;outline:0;resize:none;font:inherit;font-size:13.5px;line-height:1.7;max-height:120px;background:none;color:var(--tx);padding:4px 0}
.box .snd{width:32px;height:32px;border-radius:8px;background:var(--ac);color:#fff;border:0;display:grid;place-items:center;font-size:14px;flex:none}
.box .snd:disabled{background:#cfd6de;cursor:default}
.hint{font-size:10.5px;color:var(--tx3);text-align:center;margin-top:7px}


/* ============ RAG（過去問い合わせ・Tips）検索結果 ============ */
.ragwrap{border:1px solid var(--ln);border-radius:10px;background:var(--pn);margin-bottom:12px;overflow:hidden}
.raghd{display:flex;align-items:center;gap:8px;padding:8px 13px;background:#f6f8fb;border-bottom:1px solid var(--ln2);font-size:11.5px;color:var(--tx2);font-weight:600}
.raghd .n4{font-size:10px;font-weight:700;color:#fff;background:var(--ac);border-radius:4px;padding:1px 7px}
.raghd .cnt{margin-left:auto;font-size:10.5px;color:var(--tx3);font-weight:400}
.hit{padding:11px 13px;border-bottom:1px solid var(--ln2)}
.hit:last-child{border-bottom:0}
.hitm{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:4px}
.hitm .tid{font-family:var(--mono);font-size:10.5px;color:var(--tx3)}
.hitm .who{font-size:10.5px;color:var(--tx3)}
.rel{font-size:10px;font-weight:600;padding:1px 7px;border-radius:10px;border:1px solid}
.rel.a{background:#eaf4ee;border-color:#bcdcc8;color:#136b3c}
.rel.b{background:#eef3fa;border-color:#c8daee;color:#1b4d7e}
.rel.c{background:#f5f6f8;border-color:#dfe4ea;color:var(--tx2)}
.hitq{font-size:12.5px;line-height:1.7}
.hitq b{background:#fff6d9;font-weight:600;padding:0 2px}
.hita{font-size:11.5px;color:var(--tx2);line-height:1.75;margin-top:6px;padding-top:7px;border-top:1px dashed var(--ln2)}
.hita .lb2{font-size:10px;color:var(--tx3);display:block;margin-bottom:2px}
.hitt{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.hitt span{font-family:var(--mono);font-size:10px;background:#eef6fa;border:1px solid #cbe0ea;color:#0f5f7a;padding:0 6px;border-radius:3px}

.tip{padding:11px 13px;border-bottom:1px solid var(--ln2);background:#fffdf7}
.tip:last-child{border-bottom:0}
.tipm{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:3px}
.tipm .tid{font-family:var(--mono);font-size:10.5px;color:#8a5f14}
.tipm .pin{font-size:10px;font-weight:700;color:#8a5f14;background:#fbf0d8;border:1px solid #e6d3a4;border-radius:4px;padding:1px 7px}
.tip .tt{font-size:12.5px;font-weight:600}
.tip .tb3{font-size:11.5px;color:var(--tx2);line-height:1.75;margin-top:3px}
.tip .tf{font-size:10.5px;color:var(--tx3);margin-top:5px}

/* 候補の出典バッジ */
.prov{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.pv{font-size:10px;padding:1px 7px;border-radius:10px;border:1px solid}
.pv.h{background:#eef3fa;border-color:#c8daee;color:#1b4d7e}
.pv.t{background:#fbf5e6;border-color:#e6d3a4;color:#8a5f14}
.pv.o{background:#f0edf9;border-color:#d0c6e8;color:#5a4a8c}
.pv.w{background:#fdf3f2;border-color:#eecac6;color:#b91c1c}
.prole{font-size:11px;color:var(--tx2);background:#f7f9fc;border:1px solid var(--ln2);border-radius:7px;padding:7px 10px;margin:8px 0 0}
.prole b{color:var(--tx)}
/* ============ ナレッジグラフ タブ ============ */
.kgpane{display:none;height:calc(100vh - 52px);grid-template-columns:262px minmax(520px,1fr) 312px}
.kgpane.on{display:grid}
body.kgmode .wrap,body.kgmode .cmp{display:none}
.kgside{background:#fafbfc;border-right:1px solid var(--ln);overflow-y:auto;padding:0 0 30px}
.kgins{background:#fafbfc;border-left:1px solid var(--ln);border-right:0;overflow-y:auto;padding:0 0 30px}
.kgside::-webkit-scrollbar,.kgins::-webkit-scrollbar{width:8px}
.kgside::-webkit-scrollbar-thumb,.kgins::-webkit-scrollbar-thumb{background:#d8dee6;border-radius:4px;border:2px solid #fafbfc}
.kgh{font-size:10px;font-weight:700;color:var(--tx3);letter-spacing:.11em;padding:15px 14px 6px}
.kgsec{padding:0 12px}
.kgsearch{width:100%;border:1px solid var(--ln);border-radius:7px;padding:6px 10px;font:inherit;font-size:12px;background:#fff;outline:0}
.kgsearch:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(37,99,168,.1)}
.kgres{margin-top:6px;max-height:210px;overflow-y:auto}
.kgrow{display:flex;gap:7px;align-items:center;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:11.5px;width:100%;border:0;background:none;text-align:left}

<script>
/* ===================== データ定義 ===================== */
const DATA_Q = [
{
 tkt:"INC-0248172", dept:"融資企画部", user:"佐藤",
 sample:"住宅ローンの延滞状況を支店別・年代別に見たい",
 question:"最近、住宅ローンの延滞が増えている感覚があります。支店別と、お客さまの年代別に、直近1年くらいの延滞の状況を見て、来期の与信方針の材料にしたいのですが、どのデータを使えばよいでしょうか。テーブル名などは分かりません。",
 kw:["住宅ローン","延滞","支店別","年代別","与信"],
 intent:{theme:"住宅ローン ポートフォリオ健全性モニタリング",
  oneline:"与信方針策定のため、延滞動向を部店軸・顧客属性軸で要因分解したい、という依頼と解釈しました。",
  metrics:["延滞率","延滞債権残高","新規延滞発生率"],
  dims:["部店","顧客年代","商品","月次"]},
 dom:{node:"リテール", full:"リテール ＞ 住宅ローン（業務プロセス）", alt:"リスク（信用リスク）／全社共通（参照データ）",
  note:"<b>リテール</b>領域では、延滞率を「31日以上延滞債権のEAD ÷ 総EAD」と定義し、条件変更申請中の債権を分母・分子の双方から除外します。業務指標の定義は業務領域ごとに保持されているため、まず領域を確定させています。",
  why:"業務概念「延滞」は複数の業務領域に登場します。どの領域の業務プロセスに紐づく概念かによって、指標の計算式も、参照すべき物理テーブルも変わります。"},
 defs:[
  ["リテール ＞ 住宅ローン","延滞率","31日以上延滞債権のEAD ÷ 総EAD。条件変更申請中は分母・分子とも除外"],
  ["ホールセール ＞ 法人融資","延滞率","延滞先数 ÷ 与信先数。債務者区分（要管理先以下）と併せて評価するため母数の取り方が異なる"],
  ["リスク ＞ 信用リスク","予想損失","PD×LGD×EAD。バーゼル規制の定義に準拠し、延滞率とは別系統の指標として管理"]
 ],
 cands:[
  {name:"住宅ローン 日次スナップショット",path:"VDB_RETAIL_ANALYTICS.mart.S_HOUSING_LOAN_DAILY",sys:"リテール分析基盤（mart層）",
   fl:["ok","最推奨"],
   why:"業務指標「延滞率」が computedFrom で直接ひも付く集計層です。metric_code で指標を切り替えられ、部店・商品・顧客が同一行に揃っています。",
   trace:["延滞","リテール","住宅ローン","住宅ローン契約","延滞率","S_HOUSING_LOAN_DAILY"],
   grain:"契約 × 指標 × 営業日",fresh:"日次 05:30（月末確定は第3営業日）",acc:"要申請（機密Ⅱ）",
   evid:[["接続オントロジー","業務指標:延滞率 －computedFrom→ 本表"],
         ["業務オントロジー","業務プロセス:住宅ローン －usesData→ 本表"],
         ["根拠QA","過去の問い合わせで同種の依頼に本表を案内"]],
   detail:{
    desc:"住宅ローンの日次スナップショットです。metric_code ごとに1行を持つ縦持ち構造で、延滞率・延滞残高・実行額などを同じ表から取得できます。指標の計算はリテール領域の定義で実装済みのため、部門ごとに数値がぶれません。",
    attrs:[["business_date","k"],["housing_loan_id","k"],["metric_code","k"],["customer_id",""],["organization_id",""],["product_id",""],["metric_value",""],["risk_flag",""],["quality_status_code",""],["snapshot_timestamp",""]],
    joins:[["VDB_ENTERPRISE_REFERENCE.reference.T_ORGANIZATION","organization_id","部店名・ブロック。有効期間で時点結合"],
           ["VDB_ENTERPRISE_REFERENCE.reference.T_CUSTOMER_GOLDEN","customer_id","年代区分（age_band_code）"],
           ["VDB_ENTERPRISE_REFERENCE.reference.T_PRODUCT","product_id","商品名・商品カテゴリ"],
           ["VDB_ENTERPRISE_REFERENCE.reference.T_CALENDAR","business_date","月末フラグ・年度"]],
    cautions:["<b>metric_code の指定を必ず入れてください。</b>指定しないと複数指標が縦に混ざり、metric_value を単純合計すると意味のない値になります。",
      "<b>延滞日数の起算</b>は「約定返済日の翌日」です。リテール領域の定義であり、ホールセール領域の法人融資とは異なります。",
      "<b>risk_flag='R'（条件変更申請中）</b>は行内標準では延滞率の分母・分子の双方から除外します。",
      "<b>quality_status_code</b> が 'OK' 以外の行は品質チェック未通過です。月次確定前の速報値を見る場合はこの列で除外してください。"],
    sql:'<span class="c">-- 部店別 × 年代別 延滞率（31日以上）／ 直近13ヶ月</span>\n<span class="k">SELECT</span> <span class="k2">TO_CHAR</span>(d.business_date,<span class="s">\'YYYYMM\'</span>) <span class="k">AS</span> ym,\n       o.organization_name,\n       c.age_band_code,\n       <span class="k2">ROUND</span>(<span class="k2">AVG</span>(d.metric_value)*100, 2) <span class="k">AS</span> delinq_rate_pct,\n       <span class="k2">COUNT</span>(<span class="k">DISTINCT</span> d.housing_loan_id) <span class="k">AS</span> loan_cnt\n<span class="k">FROM</span>      VDB_RETAIL_ANALYTICS.mart.S_HOUSING_LOAN_DAILY d\n<span class="k">JOIN</span>      VDB_ENTERPRISE_REFERENCE.reference.T_ORGANIZATION o\n            <span class="k">ON</span> o.organization_id = d.organization_id\n           <span class="k">AND</span> d.business_date <span class="k">BETWEEN</span> o.effective_from <span class="k">AND</span> o.effective_to\n<span class="k">JOIN</span>      VDB_ENTERPRISE_REFERENCE.reference.T_CUSTOMER_GOLDEN c\n            <span class="k">ON</span> c.customer_id = d.customer_id\n           <span class="k">AND</span> d.business_date <span class="k">BETWEEN</span> c.effective_from <span class="k">AND</span> c.effective_to\n<span class="k">JOIN</span>      VDB_ENTERPRISE_REFERENCE.reference.T_CALENDAR cal\n            <span class="k">ON</span> cal.calendar_date = d.business_date <span class="k">AND</span> cal.month_end_flag = <span class="s">\'Y\'</span>\n<span class="k">WHERE</span>     d.metric_code = <span class="s">\'DELINQ_RATE_31D\'</span>      <span class="c">-- 指標の指定は必須</span>\n  <span class="k">AND</span>     d.quality_status_code = <span class="s">\'OK\'</span>\n  <span class="k">AND</span>     d.risk_flag &lt;&gt; <span class="s">\'R\'</span>                   <span class="c">-- 条件変更申請中を除外</span>\n  <span class="k">AND</span>     d.business_date &gt;= <span class="k2">ADD_MONTHS</span>(<span class="k2">TRUNC</span>(<span class="k2">CURRENT_DATE</span>,<span class="s">\'MM\'</span>), -13)\n<span class="k">GROUP BY</span>  <span class="k2">TO_CHAR</span>(d.business_date,<span class="s">\'YYYYMM\'</span>), o.organization_name, c.age_band_code\n<span class="k">ORDER BY</span>  1, 2, 3;',
    gov:[["業務領域","リテール"],["データオーナー","リテールデータオフィス"],["データ分類","機密Ⅱ（個人情報を含む）"],["申請手続","IDM ＞ VDB_RETAIL_ANALYTICS 参照権限"],["リードタイム","3営業日"]],
    note:"照会者（佐藤さま）は<b>本表のSELECT権限が未付与</b>です。詳細は「権限照会」タブをご覧ください。"}},

  {name:"住宅ローン イベント明細",path:"VDB_RETAIL_ANALYTICS.event.F_HOUSING_LOAN_EVENT",sys:"リテール分析基盤（event層）",
   fl:["ok","併用推奨"],
   why:"業務イベント「実行・返済・延滞」が backedBy でひも付く明細層です。延滞の発生・解消のタイミングを1件単位で追えます。",
   trace:["延滞","リテール","住宅ローン","住宅ローン契約","実行・返済・延滞","F_HOUSING_LOAN_EVENT"],
   grain:"イベント1件",fresh:"準リアルタイム",acc:"要申請（機密Ⅱ）",
   evid:[["接続オントロジー","業務イベント:実行・返済・延滞 －backedBy→ 本表"],
         ["業務オントロジー","業務プロセス:住宅ローン －usesData→ 本表"]],
   detail:{desc:"住宅ローンに発生したイベントの明細です。event_type_code で実行・約定返済・繰上返済・延滞発生・延滞解消を区別します。「月末だけ延滞が消える」といった期末要因の検証に向きます。",
    attrs:[["housing_loan_event_id","k"],["housing_loan_id",""],["customer_id",""],["organization_id",""],["product_id",""],["event_timestamp",""],["event_type_code",""],["amount",""],["channel_code",""],["processing_status_code",""]],
    joins:[["VDB_RETAIL_ANALYTICS.master.M_HOUSING_LOAN","housing_loan_id","契約属性の付与"],
           ["VDB_ENTERPRISE_REFERENCE.reference.T_ORGANIZATION","organization_id","部店名"]],
    cautions:["月末時点で切ると、月中に発生・解消した延滞が捕捉できません。日次の推移を見るときのみご利用ください。",
      "processing_status_code='CANCELLED' の取消イベントが含まれます。集計時は除外してください。",
      "行数が多いため、business_date ではなく event_timestamp でのパーティション条件を必ず付けてください。"],
    sql:"",gov:[["業務領域","リテール"],["データオーナー","リテールデータオフィス"],["データ分類","機密Ⅱ"],["申請手続","IDM ＞ VDB_RETAIL_ANALYTICS 参照権限"],["リードタイム","3営業日"]],
    note:""}},

  {name:"住宅ローン マスター",path:"VDB_RETAIL_ANALYTICS.master.M_HOUSING_LOAN",sys:"リテール分析基盤（master層）",
   fl:["n","補完"],
   why:"業務対象「住宅ローン契約」の属性と有効期間を保持します。実行年度・金利タイプ別の切り口を足すために結合します。",
   trace:["住宅ローン","リテール","住宅ローン","住宅ローン契約","住宅ローン契約を識別・管理する仮想項目","M_HOUSING_LOAN"],
   grain:"契約 × 有効期間",fresh:"日次 04:00",acc:"要申請（機密Ⅱ）",
   evid:[["接続オントロジー","業務属性:契約識別項目 －mappedToColumn→ housing_loan_id"],
         ["データオントロジー","master層。有効期間による履歴管理"]],
   detail:{desc:"住宅ローン契約の属性マスターです。effective_from／effective_to による履歴管理のため、過去時点の属性を正確に再現できます。",
    attrs:[["housing_loan_id","k"],["customer_id",""],["organization_id",""],["product_id",""],["status_code",""],["effective_from",""],["effective_to",""],["source_system_code",""],["record_updated_at",""]],
    joins:[["VDB_RETAIL_ANALYTICS.mart.S_HOUSING_LOAN_DAILY","housing_loan_id","日次値への属性付与"]],
    cautions:["<b>必ず有効期間で時点結合してください。</b>最新行だけを結合すると、期中に条件変更した契約の過去の数値が変わってしまいます。",
      "source_system_code は連携元の勘定系サブシステムを示します。統合前の旧商品は別コードになっています。"],
    sql:"",gov:[["業務領域","リテール"],["データオーナー","リテールデータオフィス"],["データ分類","機密Ⅱ"],["申請手続","IDM ＞ VDB_RETAIL_ANALYTICS 参照権限"],["リードタイム","3営業日"]],
    note:""}},

  {t:"権限グラフと突合",d:"照会者のロールで参照できるかを判定しました。共通参照層は付与済、リテール領域の3表は申請が必要です。"}

 compare:"①が回答の本体です。②は日次の発生・解消を追う場合、③は契約属性を足す場合に併用します。④は「年代別」というご要望に対応する共通マスターで、申請なしで使えます。⑤はオントロジー上に接続経路がなく、分析利用の対象外です。",

 reply:"【ご依頼】住宅ローンの延滞状況（支店別・年代別／直近1年）\n\n■ 使用するデータ\n1) VDB_RETAIL_ANALYTICS.mart.S_HOUSING_LOAN_DAILY（住宅ローン日次スナップショット）\n   metric_code='DELINQ_RATE_31D' で延滞率を取得できます。指標の計算はリテール領域の定義で実装済みです。\n2) VDB_ENTERPRISE_REFERENCE.reference.T_ORGANIZATION（組織マスター）… 部店名。有効期間で時点結合してください。\n3) VDB_ENTERPRISE_REFERENCE.reference.T_CUSTOMER_GOLDEN（統合顧客マスター）… age_band_code で年代別集計ができます。\n\n■ 集計時のご注意\n・metric_code の指定は必須です。指定しないと複数指標が縦に混ざります。\n・risk_flag='R'（条件変更申請中）は分母・分子の双方から除外してください。\n・quality_status_code='OK' 以外は品質チェック未通過です。\n・延滞率の定義はリテール領域のものです。法人融資の延滞率は債務者数ベースで別定義のため、合算はできません。\n\n■ 権限について\n統合顧客マスターは現在の権限で参照可能です。VDB_RETAIL_ANALYTICS は機密Ⅱのため、IDMからの申請（3営業日）をお願いします。\n\nサンプルSQLを添付します。"
},

    sql:'<span class="c">-- 解約前90日以内の提案接触の有無 × 解約の特徴</span>\n<span class="k">WITH</span> cancel <span class="k">AS</span> (\n  <span class="k">SELECT</span> w.customer_id, w.product_id, w.business_date, w.metric_value <span class="k">AS</span> cancel_rate\n  <span class="k">FROM</span>   VDB_RETAIL_ANALYTICS.mart.S_WEALTH_DAILY w\n  <span class="k">WHERE</span>  w.metric_code = <span class="s">\'CANCEL_RATE\'</span>\n    <span class="k">AND</span>  w.quality_status_code = <span class="s">\'OK\'</span>\n    <span class="k">AND</span>  w.business_date &gt;= <span class="k2">ADD_MONTHS</span>(<span class="k2">TRUNC</span>(<span class="k2">CURRENT_DATE</span>,<span class="s">\'MM\'</span>), -12))\n<span class="k">SELECT</span> pr.product_category,\n       c.age_band_code,\n       <span class="k">CASE WHEN</span> cp.customer_id <span class="k">IS NULL</span> <span class="k">THEN</span> <span class="s">\'提案接触なし\'</span> <span class="k">ELSE</span> <span class="s">\'提案接触あり\'</span> <span class="k">END</span> <span class="k">AS</span> contact,\n       <span class="k2">ROUND</span>(<span class="k2">AVG</span>(cn.cancel_rate)*100, 2) <span class="k">AS</span> cancel_rate_pct\n<span class="k">FROM</span>   cancel cn\n<span class="k">JOIN</span>   VDB_ENTERPRISE_REFERENCE.reference.T_PRODUCT        pr <span class="k">ON</span> pr.product_id  = cn.product_id\n<span class="k">JOIN</span>   VDB_ENTERPRISE_REFERENCE.reference.T_CUSTOMER_GOLDEN c  <span class="k">ON</span> c.customer_id = cn.customer_id\n<span class="k">LEFT JOIN</span> VDB_RETAIL_ANALYTICS.mart.S_CAMPAIGN_DAILY        cp\n       <span class="k">ON</span> cp.customer_id = cn.customer_id\n      <span class="k">AND</span> cp.business_date <span class="k">BETWEEN</span> cn.business_date - 90 <span class="k">AND</span> cn.business_date\n<span class="k">GROUP BY</span> pr.product_category, c.age_band_code,\n         <span class="k">CASE WHEN</span> cp.customer_id <span class="k">IS NULL</span> <span class="k">THEN</span>   {t:"プロセス間の結合経路を確認",d:"両プロセスの mart 層はいずれも共通参照層の統合顧客マスターと joinsWith で接続しています。customer_id を介して結合可能と判断しました。"},
  {t:"権限グラフと突合",d:"リテール領域の資産は参照可能ですが、行レベルポリシーにより担当部店内に限定されます。"}

 compare:"①②の2表の結合が今回の肝です。③は個々の約定を確認したい場合、④は顧客像を記述するために足してください。⑤はオントロジー上に接続経路がなく、分析利用の対象外です。",

 reply:"【ご依頼】投信解約者の傾向と、解約前の提案履歴\n\n■ 使用するデータ（別プロセスの2表を結合します）\n1) VDB_RETAIL_ANALYTICS.mart.S_WEALTH_DAILY（資産運用／解約率）\n   metric_code='CANCEL_RATE' はスイッチングを除外した定義です。\n2) VDB_RETAIL_ANALYTICS.mart.S_CAMPAIGN_DAILY（キャンペーン／提案接触）\n   customer_id と business_date で結合し、「解約前90日の提案接触有無」を評価できます。\n3) VDB_ENTERPRISE_REFERENCE.reference.T_CUSTOMER_GOLDEN … 年代・顧客区分の付与\n\n■ ご注意\n・解約と提案は同じリテール領域でも別の業務プロセスに属します。両者は共通参照層の顧客マスターを介して結合してください。\n・乗換を含めた解約を見る場合は metric_code='CANCEL_RATE_INCL_SWITCH' を使ってください。\n・提案記録の保持は24ヶ月です。デジタル経由の提案は S_DIGITAL_CHANNEL_DAILY 側に計上されます。\n・現在の権限では担当部店内の顧客のみが対象です。全店で見る場合はスコープ拡大申請をお願いします。\n\nサンプルSQLを添付します。"
},

 cands:[
  {name:"法人預金 日次スナップショット",path:"VDB_WHOLESALE_ANALYTICS.mart.S_CORP_DEPOSIT_DAILY",sys:"ホールセール分析基盤（mart層）",
   fl:["ok","最推奨"],
   why:"業務指標「月中平残」が computedFrom でひも付く集計層です。日々残の平均が計算済みで、経営計画資料と同一定義です。",
   trace:["法人預金","ホールセール","法人預金","法人預金口座","月中平残","S_CORP_DEPOSIT_DAILY"],
   grain:"口座 × 指標 × 営業日",fresh:"日次 05:00（月次確定は第2営業日）",acc:"参照可",
   evid:[["接続オントロジー","業務指標:月中平残 －computedFrom→ 本表"],
         ["業務オントロジー","業務プロセス:法人預金 －usesData→ 本表"],
         ["根拠QA","経営計画・実績管理の依頼で標準的に案内されている"]],
   detail:{desc:"法人預金の日次スナップショットです。metric_code='AVG_BAL_MTD' で月中平残を取得できます。期末の一時的な資金移動に左右されない業種比較ができます。",
    attrs:[["business_date","k"],["corp_deposit_id","k"],["metric_code","k"],["customer_id",""],["organization_id",""],["product_id",""],["metric_value",""],["currency_code",""],["quality_status_code",""]],
    joins:[["VDB_WHOLESALE_ANALYTICS.master.M_CORP_CUSTOMER","customer_id","業種コード・売上規模・企業グループ"],
           ["VDB_ENTERPRISE_REFERENCE.reference.T_CUSTOMER_GOLDEN","customer_id","全社名寄せ済の顧客識別"],
           ["VDB_ENTERPRISE_REFERENCE.reference.T_ORGANIZATION","organization_id","主取引店"],
           ["VDB_ENTERPRISE_REFERENCE.reference.T_CALENDAR","business_date","月末フラグ"]],
    cautions:["<b>業種比較には月末残高ではなく月中平残</b>（metric_code='AVG_BAL_MTD'）を推奨します。決済性預金の月末残高は賞与・納税期の季節性が大きいためです。",
      "<b>外貨預金は円換算後の値</b>です。換算レートは月末TTMのため、残高増減に為替変動の影響が含まれます。currency_code で内訳を確認できます。",
      "口座単位のため、顧客単位・グループ単位に集約してからご利用ください。"],
    sql:'<span class="c">-- 業種別 × 企業グループ名寄せ 月中平残の推移</span>\n<span class="k">SELECT</span> <span class="k2">TO_CHAR</span>(d.business_date,<span class="s">\'YYYYMM\'</span>) <span class="k">AS</span> ym,\n       m.industry_name,\n       <span class="k2">NVL</span>(m.group_id, m.customer_id)   <span class="k">AS</span> group_key,\n       <span class="k2">NVL</span>(m.group_name, m.corp_name)  <span class="k">AS</span> group_name,\n       <span class="k2">SUM</span>(d.metric_value)             <span class="k">AS</span> avg_bal_total\n<span class="k">FROM</span>   VDB_WHOLESALE_ANALYTICS.mart.S_CORP_DEPOSIT_DAILY d\n<span class="k">JOIN</span>   VDB_WHOLESALE_ANALYTICS.master.M_CORP_CUSTOMER   m\n       <span class="k">ON</span> m.customer_id = d.customer_id\n      <span class="k">AND</span> d.business_date <span class="k">BETWEEN</span> m.effective_from <span class="k">AND</span> m.effective_to\n<span class="k">JOIN</span>   VDB_ENTERPRISE_REFERENCE.reference.T_CALENDAR cal\n       <span class="k">ON</span> cal.calendar_date = d.business_date <span class="k">AND</span> cal.month_end_flag = <span class="s">\'Y\'</span>\n<span class="k">WHERE</span>  d.metric_code = <span class="s">\'AVG_BAL_MTD\'</span>\n  <span class="k">AND</span>  d.quality_status_code = <span class="s">\'OK\'</span>\n  <span class="k">AND</span>  m.group_priority = 1                <span class="c">-- 主グループのみ（二重計上防止）</span>\n  <span class="k">AND</span>  d.business_date &gt;= <span class="k2">ADD_MONTHS</span>(<span class="k2">TRUNC</span>(<span class="k2">CURRENT_DATE</span>,<span class="s">\'MM\'</span>), -36)\n<span class="k">GROUP BY</span> <span class="k2">TO_CHAR</span>(d.business_date,<span class="s">\'YYYYMM\'</span>), m.industry_name,\n         <span class="k2">NVL</span>(m.group_id,m.customer_id), <span class="k2">NVL</span>(m.group_name,m.corp_name)\n<span class="k">ORDER BY</span> 1, avg_bal_total <span class="k">DESC</span>;',
    gov:[["業務領域","ホールセール"],["データオーナー","法人データオフィス"],["データ分類","機密Ⅱ（取引先情報）"],["申請手続","IDM ＞ VDB_WHOLESALE_ANALYTICS 参照権限"],["リードタイム","2営業日"]],
    note:"照会者（井上さま）は<b>本件のデータをすべて参照可能</b>です。追加申請は不要です。"}},

 reply:"【ご依頼】法人預金の業種別推移（企業グループ名寄せ）\n\n■ 使用するデータ\n1) VDB_WHOLESALE_ANALYTICS.mart.S_CORP_DEPOSIT_DAILY（法人預金日次スナップショット）\n   metric_code='AVG_BAL_MTD' で月中平残を取得できます。\n2) VDB_WHOLESALE_ANALYTICS.master.M_CORP_CUSTOMER（法人顧客マスター）\n   業種コードと企業グループコードの双方を保持しています。\n3) VDB_ENTERPRISE_REFERENCE.reference.T_ORGANIZATION（組織マスター）… 部店・ブロック軸\n\n■ 「親子をまとめて見たい」について\n可能です。M_CORP_CUSTOMER の group_id で名寄せしてください。\nただし合弁会社は複数グループに所属し得るため、group_priority=1（主グループ）に限定すると二重計上を防げます。\n\n■ ご注意\n・業種比較は月末残高ではなく月中平残を推奨します（賞与・納税期の季節性を排除できます）。\n・外貨預金は月末TTMで円換算済のため、残高増減に為替の影響が含まれます。\n・平残の定義はホールセール領域のものです。リテールの個人預金は貸越を控除する別定義のため、単純合算はできません。\n・マスターとの結合は必ず有効期間で時点結合してください。\n\n井上さまの現在の権限で、上記すべて参照可能です。サンプルSQLを添付します。"
},

      "<b>当局提出資料に使用する場合</b>は、金融犯罪対策室の管理職承認と数値の二者チェックが必要です（内部規程 AML-014）。",

    sql:'<span class="c">-- 部店別・月別 アラート件数 / 真陽性率 / 平均クローズ日数</span>\n<span class="k">SELECT</span> <span class="k2">TO_CHAR</span>(d.business_date,<span class="s">\'YYYYMM\'</span>) <span class="k">AS</span> ym,\n       o.organization_name,\n       <span class="k2">SUM</span>(<span class="k">CASE WHEN</span> d.metric_code = <span class="s">\'ALERT_CNT\'</span>           <span class="k">THEN</span> d.metric_value <span class="k">END</span>) <span class="k">AS</span> alert_cnt,\n       <span class="k2">AVG</span>(<span class="k">CASE WHEN</span> d.metric_code = <span class="s">\'TRUE_POSITIVE_RATE\'</span>  <span class="k">THEN</span> d.metric_value <span class="k">END</span>) <span class="k">AS</span> true_pos_rate,\n       <span class="k2">AVG</span>(<span class="k">CASE WHEN</span> d.metric_code = <span class="s">\'CLOSE_DAYS_MEDIAN\'</span>   <span class="k">THEN</span> d.metric_value <span class="k">END</span>) <span class="k">AS</span> close_days_median\n<span class="k">FROM</span>   VDB_COMPLIANCE_AML.mart.S_AML_MONITORING_DAILY d\n<span class="k">JOIN</span>   VDB_ENTERPRISE_REFERENCE.reference.T_ORGANIZATION o\n       <span class="k">ON</span> o.organization_id = d.organization_id\n      <span class="k">AND</span> d.business_date <span class="k">BETWEEN</span> o.effective_from <span class="k">AND</span> o.effective_to\n<span class="k">WHERE</span>  d.quality_status_code = <span class="s">\'OK\'</span>\n  <span class="k">AND</span>  d.business_date &gt;= <span class="k2">ADD_MONTHS</span>(<span class="k2">TRUNC</span>(<span class="k2">CURRENT_DATE</span>,<span class="s">\'MM\'</span>), -24)\n<span class="k">GROUP BY</span> <span class="k2">TO_CHAR</span>(d.business_date,<span class="s">\'YYYYMM\'</span>), o.organization_name\n<span class="k">ORDER BY</span> 1, alert_cnt <span class="k">DESC</span>;',
    gov:[["業務領域","コンプライアンス・AML"],["データオーナー","コンプライアンス統括部"],["データ分類","機密Ⅰ（規制情報）"],["申請手続","IDM ＞ VDB_COMPLIANCE_AML 参照権限（集計）"],["リードタイム","5営業日"]],

 compare:"①②③でご要望は完結します。特に②は「件数が減った理由」を説明するために必ず併用してください。④は追加の切り口が必要な場合のみ、⑤は規制上の制約で除外しています。",

 reply:"【ご依頼】取引モニタリングのアラート件数・真陽性率・クローズ日数（部店別／月別）\n\n■ 使用するデータ\n1) VDB_COMPLIANCE_AML.mart.S_AML_MONITORING_DAILY（AML日次スナップショット）\n   metric_code で ALERT_CNT / TRUE_POSITIVE_RATE / CLOSE_DAYS_MEDIAN を切り替えられます。\n2) VDB_COMPLIANCE_AML.master.M_AML_MONITORING（検知シナリオマスター）… 閾値改定履歴\n3) VDB_ENTERPRISE_REFERENCE.reference.T_ORGANIZATION（組織マスター）… 部店名\n\n■ ご注意（数値の解釈）\n・真陽性率の分母は当月クローズ件数です。発生月基準では直近月が過小に見えます。\n・シナリオの閾値改定前後で件数の水準が不連続になります。時系列で示す際は注記をお願いします。\n・閾値そのものは行外持ち出し厳禁です。当局資料には記載しないでください。\n\n■ 個票について\nアラートの個票（VDB_COMPLIANCE_AML.event.F_AML_MONITORING_EVENT）は、業務領域に紐づく漏えい禁止の制約により、金融犯罪対策室 調査担当ロールに限定されています。今回の運用状況モニタリングは集計層で充足するため、追加申請は不要です。\n\n■ 当局提出時\n内部規程 AML-014 により、管理職承認と数値の二者チェックをお願いします。"
},

      "月初・5十日は法人のお客さまの来店が集中します。曜日平均だけで見ると実態を捉え損ねます。"],
    sql:'<span class="c">-- 部店 × 時間帯 の平均待ち時間・来店件数（直近3ヶ月の平日）</span>\n<span class="k">SELECT</span> o.organization_name,\n       d.branch_contact_id <span class="k">AS</span> time_slot,\n       <span class="k2">ROUND</span>(<span class="k2">AVG</span>(<span class="k">CASE WHEN</span> d.metric_code = <span class="s">\'WAIT_MIN_AVG\'</span>    <span class="k">THEN</span> d.metric_value <span class="k">END</span>),1) <span class="k">AS</span> wait_min_avg,\n       <span class="k2">ROUND</span>(<span class="k2">AVG</span>(<span class="k">CASE WHEN</span> d.metric_code = <span class="s">\'TICKET_CNT\'</span>      <span class="k">THEN</span> d.metric_value <span class="k">END</span>),1) <span class="k">AS</span> ticket_avg,\n       <span class="k2">ROUND</span>(<span class="k2">AVG</span>(<span class="k">CASE WHEN</span> d.metric_code = <span class="s">\'OPEN_WINDOW_CNT\'</span> <span class="k">THEN</span> d.metric_value <span class="k">END</span>),1) <span class="k">AS</span> window_avg\n<span class="k">FROM</span>   VDB_RETAIL_ANALYTICS.mart.S_BRANCH_CONTACT_DAILY d\n<span class="k">JOIN</span>   VDB_ENTERPRISE_REFERENCE.reference.T_ORGANIZATION o\n       <span class="k">ON</span> o.organization_id = d.organization_id\n      <span class="k">AND</span> d.business_date <span class="k">BETWEEN</span> o.effective_from <span class="k">AND</span> o.effective_to\n<span class="k">JOIN</span>   VDB_ENTERPRISE_REFERENCE.reference.T_CALENDAR cal\n       <span class="k">ON</span> cal.calendar_date = d.business_date <span class="k">AND</span> cal.business_day_flag = <span class="s">\'Y\'</span>\n<span class="k">WHERE</span>  d.business_date &gt;= <span class="k2">ADD_MONTHS</span>(<span class="k2">TRUNC</span>(<span class="k2">CURRENT_DATE</span>), -3)\n  <span class="k">AND</span>  d.quality_status_code = <span class="s">\'OK\'</span>\n<span class="k">GROUP BY</span> o.organization_name, d.branch_contact_id\n<span class="k">HAVING</span> <span class="k2">AVG</span>(<span class="k">CASE WHEN</span> d.metric_code = <span class="s">\'WAIT_MIN_AVG\'</span> <span class="k">THEN</span> d.metric_value <span class="k">END</span>) &gt;= 15\n<span class="k">ORDER BY</span> wait_min_avg <span class="k">DESC</span>;',

const KC={/* 業務オントロジーのノード種別（ナレッジグラフの定義に準拠） */
          cc:["#f7f1e3","#ddcda6","#7a6134"],  /* BusinessConcept  業務概念   */

          u:["#f2f5f8","#c8d2dc","#5b6672"],d:["#dde8f4","#a6c0da","#16395c"],
          t:["#eaf1f9","#b9d2ea","#1b4d7e"],m:["#eef7f3","#bfe0d2","#146c4b"],
          e:["#f4f2fa","#d8d0ee","#5a4a8c"],p:["#fdf8ee","#ecd9b6","#8a5a06"],
          ok:["#f1f9f3","#bfe0c9","#15803d"],ng:["#fdf3f2","#eecac6","#b91c1c"]};
function renderKG(tiers,opt){
  opt=opt||{};
  const W=opt.W||760, PAD=6,GAP=10,NH=40,TG=34,CH=14;
  const path=opt.path||null, lit=!!path;   /* path 指定時はアニメーションせず即表示 */
  let y=10,nodes=[],edges=[],prev=[];
  tiers.forEach((t,ti)=>{
    const cy=y; y+=CH;
    const n=t.nodes.length, nw=(W-PAD*2-GAP*(n-1))/n;
    const row=t.nodes.map((d,i)=>({...d,x:PAD+i*(nw+GAP),y,w:nw,h:NH,ti,idx:i}));
    row.forEach(r=>nodes.push(r));
    if(prev.length) prev.forEach(p=>row.forEach(c=>edges.push([p,c,ti])));
    t._cy=cy; prev=row; y+=NH+TG;
  });
  const on=(d)=>!path||path[d.ti]===d.idx;
  let s='<svg class="kg" viewBox="0 0 '+W+' '+(y-TG+10)+'" xmlns="http://www.w3.org/2000/svg">';
  edges.forEach(([a,b,ti])=>{
    const x1=a.x+a.w/2,y1=a.y+a.h,x2=b.x+b.w/2,y2=b.y,m=(y1+y2)/2;
    let cls="eg e"+ti;
    if(lit) cls+=(on(a)&&on(b))?" on hot":" on off";
    s+='<path class="'+cls+'" d="M'+x1+' '+y1+' C'+x1+' '+m+' '+x2+' '+m+' '+x2+' '+y2+'"/>';
  });
  tiers.forEach(t=>{s+='<text class="cap" x="6" y="'+(t._cy+9)+'">'+esc(t.cap)+'</text>';});
  nodes.forEach(d=>{
    const c=KC[d.k]||KC.u;
    const fs=d.l.length>17?8.2:(d.l.length>12?9.2:10.5);
    let cls="nd n"+d.ti;
    if(lit) cls+=on(d)?" on hit":" on off";
    s+='<g class="'+cls+'"><title>'+esc(d.l+" — "+d.s)+'</title>'+
      '<rect x="'+d.x+'" y="'+d.y+'" width="'+d.w+'" height="'+d.h+'" rx="6" fill="'+c[0]+'" stroke="'+(on(d)&&lit?"#2563a8":c[1])+'"/>'+
      '<text class="l1" x="'+(d.x+d.w/2)+'" y="'+(d.y+18)+'" text-anchor="middle" font-size="'+fs+'" fill="'+c[2]+'">'+esc(d.l)+'</text>'+
      '<text class="l2" x="'+(d.x+d.w/2)+'" y="'+(d.y+30)+'" text-anchor="middle">'+esc(d.s)+'</text></g>';});
  return s+'</svg>';
}
/* 候補の trace（業務語の連なり）から、グラフ上のノード位置を解決する */
function tracePath(tiers,trace){
  if(!trace) return null;
  return tiers.map((t,ti)=>t.nodes.findIndex(n=>(n.m||n.l)===trace[ti]));
}

}

function curSet(){return $(".tab.on").dataset.p==="p1"?DATA_Q:PERM_Q;}
function match(txt){
  const set=curSet();
  let best=null,bs=0;
  set.forEach(q=>{
    let s=0; q.kw.forEach(k=>{if(txt.indexOf(k)>=0) s+=k.length;});
    if(s>bs){bs=s;best=q;}
  });
  return bs>0?best:null;
}
function send(txt){
  if(!txt.trim()) return;
  const p=$(".tab.on").dataset.p;
  const q=match(txt);
  const who=q?q.dept+" "+q.user+" ・ "+q.tkt:"業務部門からの問い合わせ";
  addUser(txt,who);
  if(!q){
    think("照合しています…",()=>{
      addAI('<p>申し訳ありません。本デモでは以下のサンプル質問に対する回答のみを用意しています。下部のサンプル質問からお選びください。</p>'+
        '<ul class="t">'+curSet().map(x=>'<li>'+esc(x.sample)+'</li>').join("")+'</ul>');
    },600);
    return;
  }
  (p==="p1"?askData:askPerm)(q);
}

  const set=curSet();
  $("#chips").innerHTML=set.map((q,i)=>'<button class="chip" data-chip="'+i+'"><b>'+q.dept+'</b>'+esc(q.sample)+'</button>').join("");
}

$("#ta").addEventListener("input",e=>{
  e.target.style.height="auto"; e.target.style.height=Math.min(e.target.scrollHeight,120)+"px";
  $("#snd").disabled=!e.target.value.trim();
});
$("#ta").addEventListener("keydown",e=>{
  if(e.isComposing||e.keyCode===229) return;   /* 日本語入力の変換確定を送信としない */
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();const v=e.target.value;e.target.value="";e.target.style.height="auto";$("#snd").disabled=true;send(v);}
});

        });

      tri(tipid,"appliesTo",tids.mart);

/* ---- 索引 ---- */
const ADJ={};
E.forEach((e,i)=>{
  (ADJ[e.s]=ADJ[e.s]||[]).push({i,o:e.o,p:e.p,dir:1});
  (ADJ[e.o]=ADJ[e.o]||[]).push({i,o:e.s,p:e.p,dir:-1});
});
const NIDS=Object.keys(N);
NIDS.forEach(id=>{ N[id].deg=(ADJ[id]||[]).length; });

/* ===================== グラフ探索ビュー ===================== */
const GV={focus:"bank:KnowledgeGraph", hop:2, model:"all", sel:null,
  layers:{business:true,mapping:true,data:true,evidence:false},
  vb:{x:-520,y:-380,w:1040,h:760}, pos:{}, vis:[], path:["全社業務俯瞰"]};
const MAXN=110;

function layerOfNode(id){ return ONT.cls[N[id].t].layer; }
function nodeAllowed(id){
  const L=layerOfNode(id);
  if(!GV.layers[L]) return false;
  if(GV.model==="business" && L==="data") return false;
  if(GV.model==="data" && L==="business" && N[id].t!=="BusinessDomain" && N[id].t!=="Ontology") return false;
  /* カラムは数が多く俯瞰の妨げになるため、テーブル・属性を中心に見ているときだけ展開する */
  if(N[id].t==="Column"){
    const ft=N[GV.focus].t;
    if(["Table","Column","Schema","BusinessAttribute"].indexOf(ft)<0) return false;
  }
  return true;
}
function edgeAllowed(p){ return GV.layers[ONT.props[p].layer]!==false; }

/* 焦点からの幅優先探索でBFS木を作り、放射状に配置する */
function explore(){
  const f=GV.focus, seen={}, order=[], par={}, hopOf={};
  if(!nodeAllowed(f)){ GV.layers[layerOfNode(f)]=true; }
  seen[f]=1; hopOf[f]=0; order.push(f);
  /* 種別の重要度（俯瞰時に業務の骨格が先に見えるようにする） */
  const RANK={BusinessDomain:0,BusinessProcess:1,BusinessEntity:2,BusinessMetric:3,BusinessEvent:4,
              Table:5,BusinessAttribute:6,BusinessConcept:7,BusinessRole:8,Schema:9,Database:10,SupportTicket:11,DeskTip:11,Column:12};
  let frontier=[f];
  for(let h=1;h<=GV.hop;h++){
    /* 親1件あたりの上限を配分し、特定の枝だけが展開されないようにする */
    const cand=frontier.map(u=>({u,list:(ADJ[u]||[]).slice()
      .sort((a,b)=>(RANK[N[a.o].t]||9)-(RANK[N[b.o].t]||9))
      .filter(a=>!seen[a.o]&&edgeAllowed(a.p)&&nodeAllowed(a.o))}));
    const room=MAXN-order.length;
    const per=Math.max(2,Math.floor(room/Math.max(1,cand.length)));
    const next=[];
    cand.forEach(({u,list})=>{
      let k=0;
      list.forEach(a=>{
        if(seen[a.o]||k>=per||order.length>=MAXN) return;
        seen[a.o]=1; par[a.o]=u; hopOf[a.o]=h; order.push(a.o); next.push(a.o); k++;
      });
    });
    frontier=next;
    if(order.length>=MAXN) break;
  }
  /* BFS木の葉数から角度セクタを割り当てる */
  const kids={}; order.forEach(id=>{ if(par[id]) (kids[par[id]]=kids[par[id]]||[]).push(id); });
  const leaves={};
  (function cnt(id){ const k=kids[id]||[]; if(!k.length){leaves[id]=1;return 1;}
    let s=0; k.forEach(c=>s+=cnt(c)); leaves[id]=s; return s; })(f);
  const pos={}; pos[f]={x:0,y:0,hop:0};
  (function place(id,a0,a1){
    const k=kids[id]||[]; if(!k.length) return;
    let a=a0;
    k.forEach(c=>{
      const span=(a1-a0)*(leaves[c]/leaves[id]);
      const mid=a+span/2, r=190*hopOf[c]+(hopOf[c]>1?40:0);
      pos[c]={x:Math.cos(mid)*r, y:Math.sin(mid)*r, hop:hopOf[c]};
      place(c,a+span*0.06,a+span*0.94);
      a+=span;
    });
  })(f,-Math.PI,Math.PI);
  GV.pos=pos; GV.vis=order; GV.hopOf=hopOf;
}

function fitView(){
  const ids=GV.vis; if(!ids.length) return;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  ids.forEach(id=>{const p=GV.pos[id];if(!p)return;
    x0=Math.min(x0,p.x-90);x1=Math.max(x1,p.x+90);y0=Math.min(y0,p.y-30);y1=Math.max(y1,p.y+30);});
  const pad=40,w=x1-x0+pad*2,h=y1-y0+pad*2;
  GV.vb={x:x0-pad,y:y0-pad,w,h};
  applyVB();
}
function applyVB(){ const s=$("#kgcanvas svg"); if(s) s.setAttribute("viewBox",[GV.vb.x,GV.vb.y,GV.vb.w,GV.vb.h].join(" ")); }

function nodeBox(id){
  const n=N[id], lab=n.l;
  const w=Math.max(76,Math.min(178, lab.length*(lab.length>14?7.4:8.6)+22));
  return {w,h:n.t==="Ontology"?34:30};
}
function drawGraph(){
  explore();
  const set={}; GV.vis.forEach(id=>set[id]=1);
  const edges=[];
  E.forEach(e=>{ if(set[e.s]&&set[e.o]&&edgeAllowed(e.p)) edges.push(e); });
  const showLab=edges.length<=54;
  let s='<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"><defs>'+
    '<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">'+
    '<path d="M0 0 L8 4 L0 8 z" fill="#b9c3ce"/></marker></defs><g id="gscene">';
  const near = GV.sel? new Set([GV.sel].concat((ADJ[GV.sel]||[]).map(a=>a.o))) : null;
  edges.forEach(e=>{
    const a=GV.pos[e.s],b=GV.pos[e.o]; if(!a||!b) return;
    const lay=ONT.props[e.p].layer;
    const cls="gedge "+({mapping:"map",data:"dat",evidence:"evi"}[lay]||"")+
      (near?((near.has(e.s)&&near.has(e.o))?" hl":" dim"):"");
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2, dx=b.x-a.x, dy=b.y-a.y;
    const cx=mx-dy*0.09, cy=my+dx*0.09;
    s+='<path class="'+cls+'" marker-end="url(#ar)" d="M'+a.x.toFixed(1)+' '+a.y.toFixed(1)+
       ' Q'+cx.toFixed(1)+' '+cy.toFixed(1)+' '+b.x.toFixed(1)+' '+b.y.toFixed(1)+'"/>';
    if(showLab) s+='<text class="gelab" x="'+cx.toFixed(1)+'" y="'+(cy-2).toFixed(1)+'" text-anchor="middle">'+esc(e.p)+'</text>';
  });
  GV.vis.forEach(id=>{
    const n=N[id],p=GV.pos[id],c=ONT.cls[n.t].c,b=nodeBox(id);
    const dim=near&&!near.has(id)?" dim":"";
    const sel=GV.sel===id?" sel":"";
    const lab=n.l.length>17?n.l.slice(0,16)+"…":n.l;
    s+='<g class="gnode'+dim+sel+'" data-n="'+encodeURIComponent(id)+'" transform="translate('+
       (p.x-b.w/2).toFixed(1)+','+(p.y-b.h/2).toFixed(1)+')"><title>'+esc(n.l+" ／ "+ONT.cls[n.t].ja+(n.full?"\n"+n.full:""))+'</title>'+
       '<rect width="'+b.w+'" height="'+b.h+'" rx="7" fill="'+c[0]+'" stroke="'+c[1]+'"/>'+
       '<text x="'+(b.w/2)+'" y="'+(b.h/2-1)+'" text-anchor="middle" fill="'+c[2]+'">'+esc(lab)+'</text>'+
       '<text class="sub" x="'+(b.w/2)+'" y="'+(b.h-6)+'" text-anchor="middle" fill="'+c[2]+'">'+esc(ONT.cls[n.t].ja)+'</text></g>';
  });
  $("#kgcanvas").innerHTML=s+'</g></svg>';
  applyVB();
  $("#kgcount").textContent="表示 "+GV.vis.length+" ノード ／ "+edges.length+" トリプル（全体 "+NIDS.length.toLocaleString()+" ノード・"+E.length.toLocaleString()+" トリプル）";
  const fn=N[GV.focus];
  $("#kgkick").textContent=(GV.focus==="bank:KnowledgeGraph"?"ENTERPRISE VIEW":ONT.cls[fn.t].ja.toUpperCase()+" VIEW");
  $("#kgtitle").textContent=GV.focus==="bank:KnowledgeGraph"?"8業務領域の俯瞰":fn.l;
  $("#kgpath").innerHTML=GV.path.map((x,i)=>i===GV.path.length-1?"<b>"+esc(x)+"</b>":esc(x)).join(" › ");
}

/* ---- 詳細パネル ---- */
function inspect(id){
  GV.sel=id; drawGraph();
  const n=N[id],c=ONT.cls[n.t];
  let h='<div class="kgd"><span class="tb2" style="background:'+c[2]+'">'+c.ja+'</span>'+
    '<h3>'+esc(n.l)+'</h3>'+(n.d?'<p class="desc">'+esc(n.d)+'</p>':'');
  const facts=[];
  if(n.full) facts.push(["物理名",n.full]);
  if(n.ph) facts.push(["対応カラム",n.ph]);
  if(n.dom&&N["res:domain/"+n.dom]) facts.push(["業務領域",N["res:domain/"+n.dom].l]);
  if(n.proc) facts.push(["業務プロセス",n.proc]);
  if(n.db) facts.push(["データベース",n.db]);
  if(n.owner) facts.push(["データオーナー",n.owner]);
  if(n.sch) facts.push(["スキーマ層",{event:"event（明細）",mart:"mart（日次集計）",master:"master（属性）",reference:"reference（共通参照）"}[n.sch]||n.sch]);
  if(n.key) facts.push(["キー","主キー相当"]);
  if(n.st) facts.push(["状態",n.st==="candidate"?"candidate（QAから帰納）":n.st]);
  facts.push(["レイヤ",{business:"業務モデル",data:"データモデル",evidence:"根拠QA"}[c.layer]]);
  facts.push(["識別子",id]);
  h+='<dl>'+facts.map(f=>'<dt>'+f[0]+'</dt><dd class="mono" style="font-size:11px">'+esc(f[1])+'</dd>').join("")+'</dl>';

  if(n.q){ h+='<div class="kgqa"><div class="id">'+esc(n.l)+'</div><div class="q">'+esc(n.q)+'</div><div class="a">'+esc(n.a)+'</div></div>'; }
  if(n.tip){ h+='<div class="tip" style="border:1px solid #e6d3a4;border-radius:7px;margin-bottom:8px">'+
    '<div class="tipm"><span class="pin">TIPS</span><span class="tid">'+esc(n.by||"ITデスク")+'</span></div>'+
    '<div class="tb3">'+esc(n.tip)+'</div></div>'; }

  const byProp={};
  (ADJ[id]||[]).forEach(a=>{
    const k=(a.dir>0?"→ ":"← ")+a.p;
    (byProp[k]=byProp[k]||[]).push(a.o);
  });
  Object.keys(byProp).sort().forEach(k=>{
    const list=byProp[k];
    h+='<div class="kgrel"><div class="rl">'+esc(k.slice(0,2))+'<b>'+esc(k.slice(2))+'</b> ─ '+esc(ONT.props[k.slice(2)].ja)+' <span style="color:var(--tx3)">('+list.length+')</span></div>'+
      list.slice(0,12).map(o=>'<button class="kgrow" data-go="'+encodeURIComponent(o)+'"><span class="kgdot" style="background:'+ONT.cls[N[o].t].c[2]+'"></span><span class="nm2">'+esc(N[o].l)+'</span><span class="ct">'+esc(ONT.cls[N[o].t].ja)+'</span></button>').join("")+
      (list.length>12?'<div style="font-size:10.5px;color:var(--tx3);padding:3px 8px">ほか '+(list.length-12)+' 件</div>':'')+'</div>';
  });
  h+='<button class="btn-p" style="width:100%;margin-top:14px" data-expand="'+encodeURIComponent(id)+'">このノードを中心に展開</button></div>';
  $("#kgins").innerHTML=h;
}

function focusOn(id,pushPath){
  GV.focus=id; GV.sel=id;
  const n=N[id];
  if(pushPath!==false){
    if(id==="bank:KnowledgeGraph") GV.path=["全社業務俯瞰"];
    else{
      const base=["全社業務俯瞰"];
      if(n.dom&&N["res:domain/"+n.dom]&&n.t!=="BusinessDomain") base.push(N["res:domain/"+n.dom].l);
      base.push(n.l); GV.path=base;
    }
  }
  drawGraph(); fitView(); inspect(id);
}

/* ---- 左サイド ---- */
function renderSide(){
  $("#kgdoms").innerHTML=DOMSPEC.map(d=>{
    const id="res:domain/"+d.id;
    return '<button class="kgrow'+(GV.focus===id?" on":"")+'" data-go="'+encodeURIComponent(id)+'">'+
      '<span class="kgdot" style="background:#16395c"></span><span class="nm2">'+esc(d.l)+'</span>'+
      '<span class="ct">'+d.procs.length+'</span></button>';
  }).join("");
  const cnt={}; NIDS.forEach(i=>cnt[N[i].t]=(cnt[N[i].t]||0)+1);
  $("#kgtypes").innerHTML=Object.keys(ONT.cls).filter(t=>cnt[t]).map(t=>
    '<div class="kgrow" style="cursor:default"><span class="kgdot" style="background:'+ONT.cls[t].c[2]+'"></span>'+
    '<span class="nm2">'+ONT.cls[t].ja+'</span><span class="ct">'+cnt[t].toLocaleString()+'</span></div>').join("");
  document.querySelectorAll("#kglayer .kgtb").forEach(b=>b.classList.toggle("off",!GV.layers[b.dataset.layer]));
}
function kgSearch(q){
  const box=$("#kgres");
  q=(q||"").trim().toLowerCase();
  if(!q){ box.innerHTML=""; return; }
  const hit=NIDS.filter(i=>N[i].l.toLowerCase().indexOf(q)>=0||(N[i].full||"").toLowerCase().indexOf(q)>=0)
    .sort((a,b)=>N[b].deg-N[a].deg).slice(0,40);
  box.innerHTML=hit.length?hit.map(i=>'<button class="kgrow" data-go="'+encodeURIComponent(i)+'">'+
    '<span class="kgdot" style="background:'+ONT.cls[N[i].t].c[2]+'"></span><span class="nm2">'+esc(N[i].l)+'</span>'+
    '<span class="ct">'+ONT.cls[N[i].t].ja+'</span></button>').join(""):'<div style="font-size:11px;color:var(--tx3);padding:6px 8px">該当なし</div>';
}

/* ---- イベント ---- */
$("#kgq").addEventListener("input",e=>kgSearch(e.target.value));
$("#kgfit").addEventListener("click",fitView);
$("#kgroot").addEventListener("click",()=>focusOn("bank:KnowledgeGraph"));
$("#kghop").addEventListener("click",()=>{ GV.hop=GV.hop>=3?1:GV.hop+1; $("#kghop").textContent=GV.hop+"ホップ"; drawGraph(); fitView(); });
document.querySelectorAll("#kgmodel button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("#kgmodel button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); GV.model=b.dataset.m; drawGraph(); fitView();
}));
document.querySelectorAll("#kglayer .kgtb").forEach(b=>b.addEventListener("click",()=>{
  GV.layers[b.dataset.layer]=!GV.layers[b.dataset.layer];
  b.classList.toggle("off",!GV.layers[b.dataset.layer]); drawGraph(); fitView();
}));
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-n]"); if(g){ inspect(decodeURIComponent(g.dataset.n)); return; }
  const go=e.target.closest("[data-go]"); if(go){ focusOn(decodeURIComponent(go.dataset.go)); renderSide(); return; }
  const ex=e.target.closest("[data-expand]"); if(ex){ focusOn(decodeURIComponent(ex.dataset.expand)); renderSide(); return; }
});
/* パン・ズーム */
(function(){
  const cv=$("#kgcanvas"); let dragging=false,sx=0,sy=0,ox=0,oy=0;
  cv.addEventListener("mousedown",e=>{ if(e.target.closest("[data-n]"))return;
    dragging=true;cv.classList.add("drag");sx=e.clientX;sy=e.clientY;ox=GV.vb.x;oy=GV.vb.y; });
  window.addEventListener("mouseup",()=>{dragging=false;cv.classList.remove("drag");});
  window.addEventListener("mousemove",e=>{ if(!dragging)return;
    const r=cv.getBoundingClientRect(), k=GV.vb.w/r.width;
    GV.vb.x=ox-(e.clientX-sx)*k; GV.vb.y=oy-(e.clientY-sy)*k; applyVB(); });
  cv.addEventListener("wheel",e=>{ e.preventDefault();
    const r=cv.getBoundingClientRect(), f=e.deltaY>0?1.12:0.89;
    const mx=GV.vb.x+(e.clientX-r.left)/r.width*GV.vb.w, my=GV.vb.y+(e.clientY-r.top)/r.height*GV.vb.h;
    GV.vb.x=mx-(mx-GV.vb.x)*f; GV.vb.y=my-(my-GV.vb.y)*f;
    GV.vb.w*=f; GV.vb.h*=f; applyVB(); },{passive:false});
})();

$("#kgins").innerHTML='<div class="kgempty"><div class="o"></div>ノードを選択してください。<br>業務定義・根拠QA・接続先のデータ資産を表示します。</div>';
renderSide(); drawGraph(); fitView();
</script>
</body>
</html>
