<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Service Desk AI ｜ オントロジー搭載 問い合わせ対応アシスタント</title>
<style>
:root{
  --navy:#123a63; --navy-d:#0c2942; --navy-l:#1d5590;
  --teal:#0e8a7d; --purple:#6a4fa3; --amber:#b8760a; --red:#c0392b; --green:#1f8a4c;
  --bg:#eef1f6; --panel:#ffffff; --line:#dde3ec; --line2:#eaeef4;
  --tx:#1b2735; --tx2:#5c6b7f; --tx3:#8a97a8;
  --chip:#f3f6fb;
  --mono:"SFMono-Regular",Consolas,"Courier New",monospace;
  --sans:system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--tx);font-size:13px;line-height:1.7;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;cursor:pointer}

/* ============ ヘッダ ============ */
.appbar{height:56px;background:linear-gradient(100deg,var(--navy-d),var(--navy-l));color:#fff;display:flex;align-items:center;gap:18px;padding:0 20px;box-shadow:0 1px 6px rgba(10,30,60,.28);position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em}
.brand .logo{width:28px;height:28px;border-radius:7px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;font-size:14px}
.brand small{display:block;font-weight:400;font-size:10px;opacity:.72;letter-spacing:.04em;line-height:1.2}
.tabs{display:flex;gap:4px;margin-left:14px}
.tab{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.82);padding:7px 16px;border-radius:7px;display:flex;align-items:center;gap:7px;transition:.15s;white-space:nowrap;flex:none}
.brand,.kgstat{white-space:nowrap}
.tab:hover{background:rgba(255,255,255,.16)}
.tab.active{background:#fff;color:var(--navy-d);font-weight:700;border-color:#fff}
.appbar .right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:11px}
.kgstat{display:flex;gap:12px;background:rgba(0,0,0,.16);padding:5px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.12)}
.kgstat b{font-size:12px;font-variant-numeric:tabular-nums}
.kgstat span{opacity:.65;font-size:10px}
.avatar{width:30px;height:30px;border-radius:50%;background:#2f6fae;display:grid;place-items:center;font-size:11px;font-weight:700;border:1px solid rgba(255,255,255,.35)}

/* ============ レイアウト ============ */
.screen{display:none;height:calc(100vh - 56px);grid-template-columns:246px minmax(560px,1fr) 424px}
.screen.show{display:grid}
.col{overflow-y:auto;height:100%}
.col::-webkit-scrollbar{width:9px}
.col::-webkit-scrollbar-thumb{background:#c7d0dd;border-radius:5px;border:2px solid var(--bg)}
.left{background:#f7f9fc;border-right:1px solid var(--line)}
.center{padding:18px 24px 60px}
.right{background:#fbfcfe;border-left:1px solid var(--line);padding:0 0 60px}

/* ============ 左：問い合わせキュー ============ */
.sect-h{font-size:10.5px;font-weight:700;color:var(--tx3);letter-spacing:.09em;padding:16px 14px 7px;text-transform:uppercase}
.qitem{padding:11px 14px;border-bottom:1px solid var(--line2);cursor:pointer;border-left:3px solid transparent;transition:.12s}
.qitem:hover{background:#eef3fa}
.qitem.active{background:#e6effa;border-left-color:var(--navy-l)}
.qitem .meta{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.qitem .tkt{font-family:var(--mono);font-size:9.5px;color:var(--tx3)}
.qitem .dept{font-size:10px;color:var(--navy);background:#e4ecf7;padding:1px 6px;border-radius:3px;font-weight:600}
.qitem p{margin:0;font-size:11.5px;color:var(--tx2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.qitem.active p{color:var(--tx)}
.legend{margin:14px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:8px;font-size:10.5px;color:var(--tx2)}
.legend b{display:block;font-size:10px;color:var(--tx3);letter-spacing:.06em;margin-bottom:6px}
.legend div{display:flex;align-items:center;gap:7px;margin:3px 0}
.dot{width:9px;height:9px;border-radius:3px;flex:none}

/* ============ 中央：チャット ============ */
.thread{max-width:820px;margin:0 auto}
.bubble-user{display:flex;gap:11px;margin-bottom:20px}
.bubble-user .ava{width:32px;height:32px;border-radius:8px;background:#dfe7f2;color:var(--navy);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.bubble-user .body{background:#fff;border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:12px 15px;box-shadow:0 1px 2px rgba(20,40,70,.05)}
.bubble-user .who{font-size:10.5px;color:var(--tx3);margin-bottom:3px}
.bubble-user .who b{color:var(--tx2)}
.bubble-user .txt{font-size:13.5px;line-height:1.75}
.tagrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.tag{font-size:10px;background:var(--chip);border:1px solid var(--line);color:var(--tx2);padding:1px 7px;border-radius:11px}
.tag.hl{background:#fff5e6;border-color:#f0d9ae;color:var(--amber)}

.ai{display:flex;gap:11px}
.ai .ava{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;display:grid;place-items:center;font-size:13px;flex:none;box-shadow:0 2px 5px rgba(18,58,99,.25)}
.ai .body{flex:1;min-width:0}
.aihead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.aihead b{font-size:12px}
.aihead .badge{font-size:9.5px;background:#e8f4f2;color:var(--teal);border:1px solid #bfe3dd;padding:1px 7px;border-radius:10px;font-weight:600}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,40,70,.06);overflow:hidden}
.card>h4{margin:0;padding:9px 14px;font-size:11.5px;background:#f6f8fc;border-bottom:1px solid var(--line);color:var(--tx2);letter-spacing:.03em;display:flex;align-items:center;gap:7px}
.card>h4 .num{width:17px;height:17px;border-radius:4px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700}
.card .in{padding:13px 15px}
.card .in>p:first-child{margin-top:0}
.card .in>p:last-child{margin-bottom:0}

.kv{display:grid;grid-template-columns:104px 1fr;gap:5px 12px;font-size:12px}
.kv dt{color:var(--tx3);font-size:11px}
.kv dd{margin:0}
.pill{display:inline-block;font-size:10.5px;padding:1px 8px;border-radius:11px;margin:2px 4px 2px 0;border:1px solid}
.pill.m{background:#e8f4f2;border-color:#bfe3dd;color:#0b6d63}
.pill.d{background:#f1ecfa;border-color:#d9cdf0;color:#563d8c}
.conf{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--tx2)}
.bar{width:72px;height:5px;border-radius:3px;background:#e5eaf2;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#4bb39f)}

/* テーブル候補 */
.tbl{border:1px solid var(--line);border-radius:8px;margin-bottom:9px;overflow:hidden}
.tbl.rec{border-color:#bfe0d9;box-shadow:0 0 0 2px #e8f6f3}
.tbl.no{border-color:#f0cfc9;background:#fdf7f6}
.tbl .th{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fafbfd;border-bottom:1px solid var(--line2)}
.tbl.rec .th{background:#f2faf8}
.tbl.no .th{background:#fbeeec;border-bottom-color:#f2d8d3}
.rank{font-size:9.5px;font-weight:700;padding:1px 7px;border-radius:4px;background:var(--teal);color:#fff;flex:none}
.rank.g2{background:#7d8ea3}.rank.g3{background:#9aa8ba}.rank.x{background:var(--red)}
.sysname{font-size:10px;color:var(--tx3);background:var(--chip);border:1px solid var(--line);padding:0 6px;border-radius:3px}
.path{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--navy-d);word-break:break-all}
.tbl .tb{padding:9px 12px;font-size:11.5px;color:var(--tx2)}
.jname{font-size:12px;color:var(--tx);font-weight:600;margin-bottom:5px}
.attrs{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.attr{font-family:var(--mono);font-size:10px;background:#f4f7fb;border:1px solid var(--line);padding:1px 6px;border-radius:3px;color:var(--tx2)}
.attr.key{background:#fff6e8;border-color:#f0dcb8;color:var(--amber)}
.metaline{display:flex;flex-wrap:wrap;gap:5px 16px;font-size:10.5px;color:var(--tx3);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.metaline b{color:var(--tx2);font-weight:600}

ul.tight{margin:0;padding-left:17px}
ul.tight li{margin:5px 0;font-size:12px}
.note{background:#fffaf0;border:1px solid #f0e2c4;border-left:3px solid var(--amber);border-radius:0 6px 6px 0;padding:9px 12px;font-size:11.5px;margin:8px 0 0}
.note b{color:var(--amber)}

pre.sql{margin:0;background:#0f2033;color:#d8e6f5;font-family:var(--mono);font-size:11px;line-height:1.65;padding:13px 15px;overflow-x:auto}
pre.sql .k{color:#7fb4e8}.k2{color:#c99bdd}.s{color:#9fd39a}.c{color:#6b8199;font-style:italic}
pre.gql{margin:0;background:#12253c;color:#cfe0f2;font-family:var(--mono);font-size:10.5px;line-height:1.7;padding:12px 14px;overflow-x:auto;border-radius:7px}
.gql .n{color:#7fd6c6}.gql .r{color:#e0b978}.gql .v{color:#9db9d6}

.gov{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.govbox{background:#f8fafd;border:1px solid var(--line2);border-radius:7px;padding:9px 11px}
.govbox span{display:block;font-size:10px;color:var(--tx3);margin-bottom:2px}
.govbox b{font-size:11.5px;font-weight:600}

.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn{border:1px solid var(--line);background:#fff;color:var(--tx2);padding:6px 13px;border-radius:6px;font-size:11.5px;transition:.13s}
.btn:hover{background:#f2f6fc;border-color:#b9c7db}
.btn.p{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}
.btn.p:hover{background:var(--navy-l)}

/* ============ 右：オントロジーパネル ============ */
.rpanel-h{position:sticky;top:0;background:#fbfcfe;border-bottom:1px solid var(--line);padding:13px 16px 11px;z-index:5}
.rpanel-h .t{font-size:12px;font-weight:700;display:flex;align-items:center;gap:7px}
.rpanel-h .t i{width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 3px rgba(14,138,125,.16);display:inline-block}
.rpanel-h .s{font-size:10.5px;color:var(--tx3);margin-top:2px}
.rbox{margin:12px 14px;background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.rbox>h5{margin:0;padding:8px 12px;font-size:10.5px;letter-spacing:.05em;color:var(--tx2);background:#f6f8fc;border-bottom:1px solid var(--line2);font-weight:700}
.rbox .rin{padding:11px 12px}
svg.kg{display:block;width:100%;height:auto;background:linear-gradient(#fdfefe,#f7fafd)}
.kg .cap{font-size:8.5px;fill:var(--tx3);letter-spacing:.04em}
.kg .rel{font-size:8px;fill:#a4b1c2;font-family:var(--mono)}
.kg g.node{opacity:.18;transition:opacity .45s}
.kg g.node.on{opacity:1}
.kg path.edge{stroke:#c3cfdd;fill:none;stroke-width:1.2;opacity:.1;transition:opacity .45s}
.kg path.edge.on{opacity:.9}
.kg path.edge.hot{stroke:var(--teal);stroke-width:1.8}
.kg rect{rx:5}
.kg text.l{font-weight:700;fill:#fff}
.kg text.s2{fill:rgba(255,255,255,.72);font-size:7.5px}

.steps{counter-reset:s}
.step{display:flex;gap:9px;padding:9px 0;border-bottom:1px dashed var(--line2)}
.step:last-child{border-bottom:0;padding-bottom:0}
.step .no{width:18px;height:18px;border-radius:50%;background:#e8eef7;color:var(--navy);font-size:9.5px;font-weight:700;display:grid;place-items:center;flex:none;margin-top:1px}
.step.done .no{background:var(--teal);color:#fff}
.step .sb{flex:1;min-width:0}
.step .sb b{font-size:11.5px;display:block}
.step .sb p{margin:2px 0 0;font-size:10.5px;color:var(--tx2);line-height:1.55}
.step .sc{font-family:var(--mono);font-size:9.5px;color:var(--teal);flex:none}

/* ============ 権限画面 ============ */
.verdict{border-radius:10px;padding:14px 16px;margin-bottom:12px;display:flex;gap:13px;align-items:flex-start}
.verdict .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:17px;flex:none;color:#fff}
.verdict h3{margin:0 0 3px;font-size:14px}
.verdict p{margin:0;font-size:12px;line-height:1.65}
.v-ng{background:#fdf1ef;border:1px solid #f2cfc8}.v-ng .ic{background:var(--red)}.v-ng h3{color:#a3291b}
.v-warn{background:#fffaef;border:1px solid #f0e0bd}.v-warn .ic{background:var(--amber)}.v-warn h3{color:#8f5c05}
.v-ok{background:#f0f9f3;border:1px solid #c7e6d3}.v-ok .ic{background:var(--green)}.v-ok h3{color:#166b3b}

.chain{list-style:none;margin:0;padding:0}
.chain li{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--line2);position:relative}
.chain li:last-child{border-bottom:0}
.chain .st{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff;flex:none;font-weight:700}
.st.ok{background:var(--green)}.st.ng{background:var(--red)}.st.wa{background:var(--amber)}
.chain .cb b{font-size:12px}
.chain .cb .lbl{font-size:10px;color:var(--tx3);letter-spacing:.05em;margin-bottom:1px}
.chain .cb p{margin:3px 0 0;font-size:11px;color:var(--tx2);line-height:1.6}
.chain .cb code{font-family:var(--mono);font-size:10.5px;background:#f2f5fa;border:1px solid var(--line2);padding:0 4px;border-radius:3px}

.action{display:flex;gap:11px;padding:11px 0;border-bottom:1px dashed var(--line2)}
.action:last-child{border-bottom:0;padding-bottom:0}
.action .n{width:21px;height:21px;border-radius:6px;background:var(--navy);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;flex:none;margin-top:1px}
.action b{font-size:12px}
.action p{margin:3px 0 0;font-size:11.5px;color:var(--tx2)}
.action .mt{font-size:10px;color:var(--tx3);margin-top:5px;display:flex;gap:12px;flex-wrap:wrap}
.action .mt em{font-style:normal;color:var(--red);font-weight:600}

table.mini{width:100%;border-collapse:collapse;font-size:10.5px}
table.mini th{text-align:left;font-weight:600;color:var(--tx3);border-bottom:1px solid var(--line);padding:5px 6px;font-size:9.5px;letter-spacing:.04em}
table.mini td{border-bottom:1px solid var(--line2);padding:5px 6px;color:var(--tx2);font-family:var(--mono);font-size:10px}
table.mini td.n{font-family:var(--sans)}
.deny{color:var(--red);font-weight:700}
.allow{color:var(--green);font-weight:700}

.policy{border:1px solid var(--line);border-radius:7px;padding:9px 11px;margin-bottom:8px;background:#fff}
.policy .pt{font-size:9.5px;font-weight:700;letter-spacing:.05em;padding:1px 7px;border-radius:4px;display:inline-block;margin-bottom:4px}
.pt.mask{background:#f1ecfa;color:#563d8c}
.pt.rls{background:#e8f0fb;color:var(--navy)}
.pt.aud{background:#eef1f4;color:var(--tx2)}
.policy code{font-family:var(--mono);font-size:10.5px;display:block;background:#f7f9fc;border:1px solid var(--line2);border-radius:4px;padding:5px 7px;margin-top:5px;color:#39506b;overflow-x:auto}

.thinking{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--tx2);padding:10px 0}
.thinking .sp{width:14px;height:14px;border:2px solid #cfd9e6;border-top-color:var(--teal);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.fade{animation:fi .4s ease both}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.mono{font-family:var(--mono)}
.foot{text-align:center;font-size:10px;color:var(--tx3);padding:20px 0 0}
</style>
</head>
<body>

<div class="appbar">
  <div class="brand">
    <div class="logo">◈</div>
    <div>IT Service Desk AI
      <small>ITシステム部 サポートデスク支援 ／ Ontology-Driven Data Navigator</small>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" data-screen="s1"><span>🔎</span> データ照会</button>
    <button class="tab" data-screen="s2"><span>🔐</span> 権限照会</button>
  </div>
  <div class="right">
    <div class="kgstat">
      <div><b>1,284</b> <span>概念</span></div>
      <div><b>3,917</b> <span>関係</span></div>
      <div><b>8,431</b> <span>物理テーブル</span></div>
      <div><b>2026-08-20</b> <span>KG更新</span></div>
    </div>
    <div class="avatar">IT</div>
  </div>
</div>

<!-- ================= 画面1：データ照会 ================= -->
<div class="screen show" id="s1">
  <div class="col left">
    <div class="sect-h">未対応の問い合わせ <span id="q1count"></span></div>
    <div id="q1list"></div>
    <div class="legend">
      <b>ナレッジグラフ 凡例</b>
      <div><i class="dot" style="background:#7d8ea3"></i> 問い合わせ発話</div>
      <div><i class="dot" style="background:#123a63"></i> 分析テーマ（業務オントロジー）</div>
      <div><i class="dot" style="background:#0e8a7d"></i> 分析指標（メジャー／KPI）</div>
      <div><i class="dot" style="background:#6a4fa3"></i> 業務エンティティ（概念）</div>
      <div><i class="dot" style="background:#b8760a"></i> 物理テーブル／マート</div>
    </div>
  </div>
  <div class="col center"><div class="thread" id="s1thread"></div></div>
  <div class="col right" id="s1right"></div>
</div>

<!-- ================= 画面2：権限照会 ================= -->
<div class="screen" id="s2">
  <div class="col left">
    <div class="sect-h">未対応の問い合わせ <span id="q2count"></span></div>
    <div id="q2list"></div>
    <div class="legend">
      <b>権限チェーン 判定</b>
      <div><i class="dot" style="background:#1f8a4c;border-radius:50%"></i> 充足（通過）</div>
      <div><i class="dot" style="background:#c0392b;border-radius:50%"></i> 不足（ここで拒否）</div>
      <div><i class="dot" style="background:#b8760a;border-radius:50%"></i> 条件付き／要注意</div>
    </div>
  </div>
  <div class="col center"><div class="thread" id="s2thread"></div></div>
  <div class="col right" id="s2right"></div>
</div>

<script>
/* =======================================================================
   画面1：データ照会 ― 問い合わせデータ（銀行想定Q&A）
   ======================================================================= */
const DATA_Q = [
{
  tkt:"INC-0248172", dept:"融資企画部", user:"佐藤 （与信管理グループ）", ini:"佐",
  short:"住宅ローンの延滞が増えている感覚がある。支店別・お客さまの年代別に直近1年の状況を見たい。どのデータを使えばいい？",
  question:"最近、住宅ローンの延滞が増えている感覚があります。支店別と、お客さまの年代別に、直近1年くらいの延滞の状況を見て、来期の与信方針の材料にしたいのですが、どのデータを使えばよいでしょうか。テーブル名などは分かりません。",
  tags:[["住宅ローン","hl"],["延滞","hl"],["支店別","hl"],["年代別","hl"],["直近1年",""],["与信方針",""]],
  interp:{
    theme:"個人ローン ポートフォリオ健全性モニタリング",
    conf:92,
    purpose:"与信方針策定のための延滞動向の要因分解（店舗軸／顧客属性軸）",
    metrics:["延滞率（31日以上）","延滞債権残高","新規延滞発生率","回収率"],

  steps:[

  summary:"ご要望は <b>「住宅ローン延滞のポートフォリオ健全性モニタリング」</b> と解釈しました。<b>情報系DWH（DWH_RTL）の住宅ローン延滞月次マート</b>を主データとし、契約・顧客属性・店番マスタを結合することで、支店別×年代別の延滞率を算出できます。勘定系ホストの直接照会は不要です。",
  primary:[{

    desc:"契約単位×月末時点の延滞ステータスと残高を保持する集計済マート。延滞率算出の分母（対象債権）・分子（延滞債権）が定義済のため、行内の与信レポートと数値が一致します。",

    meta:[["粒度","契約 × 月末"],["更新","月次／第3営業日 09:00 確定"],["保有期間","84ヶ月（7年）"],["行数","約 1,240万"]]

  avoid:[

    {path:"DWH_RTL.STG.S_LOAN_DELINQ_DAILY", jname:"延滞 日次ステージング", reason:"クレンジング前のため、取消・再送レコードの重複を含みます。集計値が公式レポートと乖離します。"}
  ],
  cautions:[
    "<b>延滞日数の起算</b>は「約定返済日の翌日」です。他行事例の「入金予定日基準」とは1日ずれます。",
    "<b>DELINQ_CD = 90（期日変更／条件変更 申請中）</b>は、行内標準では延滞率の分母・分子の双方から除外します（RESCHED_FLG='1'）。",
    "<b>年代</b>は各月末時点の満年齢で算出してください。契約時年齢ではありません。",
    "<b>2024年10月の商品統合</b>により旧「住宅ローンワイド」のPROD_CDが変更されています。前年同月比を取る場合はPROD_CD変換マスタ（M_PROD_CONV）の適用が必要です。"
  ],
  sql:'<span class="c">-- 支店別 × 年代別 延滞率（31日以上）／ 直近13ヶ月</span>\n<span class="k">SELECT</span> d.YM,\n       b.BRANCH_NM, b.BLOCK_NM,\n       a.AGE_BAND,\n       <span class="k2">COUNT</span>(*)                                   <span class="k">AS</span> CNT_TOTAL,\n       <span class="k2">SUM</span>(<span class="k">CASE WHEN</span> d.DELINQ_DAYS &gt;= 31 <span class="k">THEN</span> 1 <span class="k">ELSE</span> 0 <span class="k">END</span>) <span class="k">AS</span> CNT_DELINQ,\n       <span class="k2">ROUND</span>(<span class="k2">SUM</span>(<span class="k">CASE WHEN</span> d.DELINQ_DAYS &gt;= 31 <span class="k">THEN</span> d.EAD <span class="k">ELSE</span> 0 <span class="k">END</span>)\n             / <span class="k2">NULLIF</span>(<span class="k2">SUM</span>(d.EAD),0) * 100, 2)      <span class="k">AS</span> DELINQ_RATIO_PCT\n<span class="k">FROM</span>       DWH_RTL.MART_CREDIT.M_LOAN_DELINQ_MTH d\n<span class="k">JOIN</span>       DWH_RTL.MST.M_BRANCH            b <span class="k">ON</span> b.BRANCH_CD = d.BRANCH_CD\n                                              <span class="k">AND</span> d.YM <span class="k">BETWEEN</span> b.VALID_FROM <span class="k">AND</span> b.VALID_TO\n<span class="k">JOIN</span>       DWH_RTL.CORE.V_CUST_AGE_BAND    a <span class="k">ON</span> a.CUST_NO  = d.CUST_NO\n                                              <span class="k">AND</span> a.YM       = d.YM   <span class="c">-- 年代区分ビュー（マスキング済）</span>\n<span class="k">WHERE</span>      d.YM <span class="k">BETWEEN</span> <span class="s">\'202508\'</span> <span class="k">AND</span> <span class="s">\'202607\'</span>\n  <span class="k">AND</span>      d.PROD_CD <span class="k">IN</span> (<span class="k2">SELECT</span> PROD_CD <span class="k">FROM</span> DWH_RTL.MST.M_PROD_CONV\n                        <span class="k">WHERE</span> PROD_GRP = <span class="s">\'HOUSING_LOAN\'</span>)   <span class="c">-- 商品統合前後を名寄せ</span>\n  <span class="k">AND</span>      d.RESCHED_FLG = <span class="s">\'0\'</span>                          <span class="c">-- 条件変更申請中を除外</span>\n<span class="k">GROUP BY</span>   d.YM, b.BRANCH_NM, b.BLOCK_NM, a.AGE_BAND\n<span class="k">ORDER BY</span>   d.YM, b.BLOCK_NM, a.AGE_BAND;',
  gov:[["データオーナー","リスク統括部 与信管理グループ"],["データ分類","機密Ⅱ（個人情報を含む）"],["申請手続","IDM ＞ DWH_RTL 参照権限（与信系）"],["標準リードタイム","3営業日（承認2段階）"]],
  govnote:"照会者（佐藤さま）は <b>M_LOAN_DELINQ_MTH のSELECT権限が未付与</b>です。年代区分ビュー <span class='mono'>V_CUST_AGE_BAND</span> は現ロールで参照可能です。→ 権限の詳細は「権限照会」タブの INC-0248315 をご覧ください。"
},

    {t:"分析テーマの推定",d:"「顧客離反（Churn）分析」を第1候補（0.87）。第2候補「AUM残高分析」（0.41）は指標が一致せず棄却。",sc:"0.87"},

    {t:"アクセス可否の事前判定",d:"照会者ロール R_RTL_SALES_RO ですべて参照可能。ただし担当店舗スコープの行制限あり。",sc:"3 OK"}
  ],
  summary:"<b>「投信の顧客離反（解約）分析」</b>と解釈しました。解約行動は<b>投信売買履歴マート</b>、その前段の提案は<b>CRM連携の提案ファクトマート</b>で追えます。両者は顧客番号＋日付で結合でき、「解約前90日の提案有無」といった分析が可能です。",
  primary:[{
    rank:"最推奨", sys:"情報系DWH / 預り資産マート", path:"DWH_RTL.MART_ASSET.M_FUND_TRADE_HIST",
    jname:"投資信託 売買履歴マート",
    desc:"購入・解約・分配金の約定単位履歴。解約フラグ、保有期間、解約時の取得原価・評価額（含み損益）が計算済で保持されています。",

    meta:[["粒度","約定明細"],["更新","日次 05:30"],["保有期間","60ヶ月"],["行数","約 3,800万"]]
  }],
  sup:[
    {sys:"情報系DWH（CRM連携）", path:"DWH_RTL.MART_CRM.M_PROPOSAL_FACT", jname:"商品提案ファクト", desc:"渉外・窓口の提案活動を提案単位で保持。提案商品／提案日／チャネル／担当者／結果区分。CRM本番から日次連携。", join:"CUST_NO + PROPOSAL_DT"},
    {sys:"情報系DWH", path:"DWH_RTL.CORE.T_FUND_HOLD_SNAP", jname:"投信 保有残高スナップ（日次）", desc:"日次の保有口数・評価額。解約直前の残高推移や、部分解約の把握に使用。", join:"CUST_NO + FUND_CD"},

  ],
  cautions:[
    "<b>「解約」の定義</b>に注意。TRADE_TYPE='SELL' には「スイッチング（乗換）」が含まれます。純粋な資金流出のみを見る場合は CANCEL_TYPE='FULL' かつ SWITCH_FLG='0' で絞り込んでください。",
    "<b>提案履歴の保持期間は24ヶ月</b>です。それ以前の提案はCRM側にのみ存在し、DWHには連携されていません。",
    "<b>NISA口座</b>の解約は制度上の非課税枠復活と関係するため、口座区分（ACCT_TYPE）別に分けて解釈することを推奨します。"
  ],
  sql:'<span class="c">-- 解約前90日以内に提案接触があったか × 解約率</span>\n<span class="k">WITH</span> cancel <span class="k">AS</span> (\n  <span class="k">SELECT</span> CUST_NO, FUND_CD, TRADE_DT, AMOUNT, HOLD_DAYS, UNREAL_PL_RATE\n  <span class="k">FROM</span>   DWH_RTL.MART_ASSET.M_FUND_TRADE_HIST\n  <span class="k">WHERE</span>  TRADE_TYPE = <span class="s">\'SELL\'</span> <span class="k">AND</span> CANCEL_TYPE = <span class="s">\'FULL\'</span> <span class="k">AND</span> SWITCH_FLG = <span class="s">\'0\'</span>\n    <span class="k">AND</span>  TRADE_DT &gt;= <span class="k2">ADD_MONTHS</span>(<span class="k2">TRUNC</span>(<span class="k2">SYSDATE</span>,<span class="s">\'MM\'</span>), -12)\n)\n<span class="k">SELECT</span> f.ASSET_CLASS,\n       <span class="k">CASE WHEN</span> p.CUST_NO <span class="k">IS NULL</span> <span class="k">THEN</span> <span class="s">\'提案接触なし\'</span> <span class="k">ELSE</span> <span class="s">\'提案接触あり\'</span> <span class="k">END</span> <span class="k">AS</span> CONTACT,\n       <span class="k2">COUNT</span>(*) <span class="k">AS</span> CANCEL_CNT,\n       <span class="k2">ROUND</span>(<span class="k2">AVG</span>(c.HOLD_DAYS))     <span class="k">AS</span> AVG_HOLD_DAYS,\n       <span class="k2">ROUND</span>(<span class="k2">AVG</span>(c.UNREAL_PL_RATE),2) <span class="k">AS</span> AVG_PL_RATE\n<span class="k">FROM</span>   cancel c\n<span class="k">JOIN</span>   DWH_RTL.MST.M_FUND f <span class="k">ON</span> f.FUND_CD = c.FUND_CD\n<span class="k">LEFT JOIN</span> DWH_RTL.MART_CRM.M_PROPOSAL_FACT p\n       <span class="k">ON</span>  p.CUST_NO = c.CUST_NO\n       <span class="k">AND</span> p.PROPOSAL_DT <span class="k">BETWEEN</span> c.TRADE_DT - 90 <span class="k">AND</span> c.TRADE_DT\n<span class="k">GROUP BY</span> f.ASSET_CLASS, <span class="k">CASE WHEN</span> p.CUST_NO <span class="k">IS NULL</span> <span class="k">THEN</span> <span class="s">\'提案接触なし\'</span> <span class="k">ELSE</span> <span class="s">\'提案接触あり\'</span> <span class="k">END</span>;',
  gov:[["データオーナー","リテール推進部 ／ CRM部分は営業企画部"],["データ分類","機密Ⅱ（個人情報・取引情報）"],["申請手続","IDM ＞ DWH_RTL 参照権限（預り資産）"],["標準リードタイム","2営業日"]],
  govnote:"照会者（高橋さま）は<b>本件のテーブルすべてを参照可能</b>です。ただし行レベルポリシーにより<b>担当ブロック内の顧客のみ</b>が返ります。全店分析が必要な場合はスコープ拡大申請が必要です。"

{
  tkt:"INC-0248233", dept:"法人営業部", user:"井上 （法人企画グループ）", ini:"井",
  short:"法人のお客さまの預金残高の推移を、業種別に見たい。系列企業はまとめて見られる？",
  question:"法人のお客さまの預金残高が業種によってどう動いているかを見たいです。あと、親会社と子会社は別々でなくグループでまとめて見たいのですが、そういう見方はできますか。",

    conf:89,
    purpose:"業種別の資金動向把握と、グループ与信・取引深耕の方針検討",
    metrics:["月中平残","月末残高","前年同月比 増減額","業種別シェア"],
    dims:["業種（JSIC中分類）","企業グループ","売上規模","地域","預金種目"],
    period:"直近36ヶ月"
  },
  gql:'<span class="r">MATCH</span> (t:<span class="n">AnalysisTheme</span> {id:<span class="v">"THM_CORP_DEPOSIT_MIX"</span>})\n      -[:<span class="r">MEASURED_BY</span>]-&gt;(m:<span class="n">Metric</span>)-[:<span class="r">REQUIRES_ENTITY</span>]-&gt;(e)\n<span class="r">MATCH</span> (e:<span class="n">BusinessEntity</span>{id:<span class="v">"ENT_CORP_CUSTOMER"</span>})\n      -[:<span class="r">HAS_HIERARCHY</span>]-&gt;(h:<span class="n">Hierarchy</span>{id:<span class="v">"HIER_CORP_GROUP"</span>})\n<span class="r">RETURN</span> e, h, collect(m)',
  tiers:[
    {cap:"① 発話 ─ 業務語彙の抽出", rel:"", nodes:[{l:"業務部門の問い合わせ",s:"法人営業部",k:"u"}]},
    {cap:"② is_about → 分析テーマ推定", rel:"is_about", nodes:[{l:"法人預金",s:"ポートフォリオ分析",k:"t"}]},
    {cap:"③ measured_by → 分析指標", rel:"measured_by", nodes:[{l:"月中平残",s:"Avg Bal",k:"m"},{l:"末残増減",s:"YoY",k:"m"},{l:"業種シェア",s:"Mix",k:"m"}]},
    {cap:"④ requires_entity → 業務エンティティ", rel:"requires_entity", nodes:[{l:"預金口座",s:"Account",k:"e"},{l:"法人顧客",s:"Corp Cust",k:"e"},{l:"企業グループ",s:"Group",k:"e"},{l:"業種",s:"Industry",k:"e"}]},
    {cap:"⑤ physicalized_as → 物理テーブル", rel:"physicalized_as", nodes:[{l:"M_DEP_BAL_MTH",s:"MART_DEPOSIT",k:"p"},{l:"M_CORP_CUST",s:"MST",k:"p"},{l:"M_CORP_GROUP",s:"MST",k:"p"}]}
  ],
  steps:[
    {t:"発話からの語彙抽出",d:"「法人」「預金残高」「業種別」「親会社・子会社＝グループ」を抽出。「まとめて」を階層集約要求と解釈。",sc:"4 terms"},
    {t:"業務オントロジーへのマッピング",d:"業種 → 分類体系:日本標準産業分類(JSIC)。企業グループ → 顧客階層:資本関係グループ。",sc:"0.95"},
    {t:"階層（Hierarchy）関係の検出",d:"法人顧客エンティティに has_hierarchy 関係で「企業グループ階層」が紐づくことを検知。名寄せキーの提示が必要と判定。",sc:"hit"},
    {t:"指標の展開（measured_by）",d:"預金分析の標準指標セット（平残／末残／増減）を適用。平残は月次マートに計算済。",sc:"4/9"},
    {t:"エンティティ→物理テーブル解決",d:"法人系DWH（DWH_CORP）配下の3テーブルで充足。個人系（DWH_RTL）は対象外として除外。",sc:"7→3"},
    {t:"アクセス可否の事前判定",d:"照会者ロール R_CORP_ANALYST_RO ですべて参照可能。",sc:"3 OK"}
  ],
  summary:"<b>「法人預金の業種別ポートフォリオ分析」</b>と解釈しました。<b>法人預金月次残高マート</b>に業種コード・企業グループコードを付与できるマスタが揃っており、ご要望の<b>グループ名寄せ集計は M_CORP_GROUP の GROUP_CD で実現できます</b>。",
  primary:[{
    rank:"最推奨", sys:"情報系DWH（法人） / Snowflake", path:"DWH_CORP.MART_DEPOSIT.M_DEP_BAL_MTH",
    jname:"法人預金 月次残高マート",
    desc:"法人顧客×預金種目×月の平残・末残。月中平残は日々残の平均として算出済で、経営計画資料と同一定義です。",
    attrs:[["YM","key"],["CUST_NO","key"],["DEP_TYPE","key"],["AVG_BAL",""],["END_BAL",""],["MAIN_BRANCH_CD",""]],
    meta:[["粒度","法人顧客 × 預金種目 × 月"],["更新","月次／第2営業日"],["保有期間","60ヶ月"],["行数","約 460万"]]
  }],
  sup:[
    {sys:"情報系DWH（法人）", path:"DWH_CORP.MST.M_CORP_CUST", jname:"法人顧客マスタ", desc:"商号・JSIC業種コード・自行業種コード・売上規模区分・設立年月・本社所在地。", join:"CUST_NO"},
    {sys:"情報系DWH（法人）", path:"DWH_CORP.MST.M_CORP_GROUP", jname:"企業グループマスタ", desc:"資本関係に基づくグループコードと、親子関係（PARENT_CUST_NO／持株比率）。名寄せの起点。", join:"CUST_NO"},
    {sys:"情報系DWH（法人）", path:"DWH_CORP.MST.M_INDUSTRY", jname:"業種コードマスタ", desc:"JSIC大分類／中分類の名称、および自行業種との読替。", join:"JSIC_CD"}
  ],
  avoid:[
    {path:"HOST_ACCT.DEPMST", jname:"勘定系 預金元帳（ホスト）", reason:"分析目的での直接照会は不可。日次でDWHへ連携済です。"}
  ],
  cautions:[
    "<b>業種コードは2系統</b>あります。対外開示・当局報告はJSIC、行内の営業管理は自行業種です。目的に応じて選択してください（本件は業種動向のためJSIC中分類を推奨）。",
    "<b>グループ集計時の二重計上</b>にご注意ください。M_CORP_GROUP は持株比率20%以上を関係会社として登録しており、合弁会社は複数グループに所属し得ます（GROUP_PRIORITY=1 で主グループのみ採用を推奨）。",
    "<b>決済性預金の月末残高は季節性が大きい</b>（賞与・納税期）ため、業種比較には月中平残（AVG_BAL）の利用を推奨します。"
  ],
  sql:'<span class="c">-- 業種（JSIC中分類）別 × 企業グループ名寄せ 月中平残の推移</span>\n<span class="k">SELECT</span> b.YM,\n       i.JSIC_MID_NM                     <span class="k">AS</span> INDUSTRY,\n       <span class="k2">NVL</span>(g.GROUP_CD, c.CUST_NO)         <span class="k">AS</span> GROUP_KEY,\n       <span class="k2">NVL</span>(g.GROUP_NM, c.CORP_NM)         <span class="k">AS</span> GROUP_NM,\n       <span class="k2">SUM</span>(b.AVG_BAL)                     <span class="k">AS</span> AVG_BAL_TOTAL\n<span class="k">FROM</span>   DWH_CORP.MART_DEPOSIT.M_DEP_BAL_MTH b\n<span class="k">JOIN</span>   DWH_CORP.MST.M_CORP_CUST  c <span class="k">ON</span> c.CUST_NO = b.CUST_NO\n<span class="k">JOIN</span>   DWH_CORP.MST.M_INDUSTRY   i <span class="k">ON</span> i.JSIC_CD = c.JSIC_CD\n<span class="k">LEFT JOIN</span> DWH_CORP.MST.M_CORP_GROUP g\n       <span class="k">ON</span> g.CUST_NO = c.CUST_NO <span class="k">AND</span> g.GROUP_PRIORITY = 1   <span class="c">-- 主グループのみ（二重計上防止）</span>\n<span class="k">WHERE</span>  b.YM &gt;= <span class="s">\'202308\'</span>\n  <span class="k">AND</span>  b.DEP_TYPE <span class="k">IN</span> (<span class="s">\'01\'</span>,<span class="s">\'02\'</span>,<span class="s">\'11\'</span>)      <span class="c">-- 当座・普通・定期</span>\n<span class="k">GROUP BY</span> b.YM, i.JSIC_MID_NM, <span class="k2">NVL</span>(g.GROUP_CD,c.CUST_NO), <span class="k2">NVL</span>(g.GROUP_NM,c.CORP_NM)\n<span class="k">ORDER BY</span> b.YM, AVG_BAL_TOTAL <span class="k">DESC</span>;',
  gov:[["データオーナー","法人営業部 法人企画グループ"],["データ分類","機密Ⅱ（取引先情報）"],["申請手続","IDM ＞ DWH_CORP 参照権限"],["標準リードタイム","2営業日"]],
  govnote:"照会者（井上さま）は<b>本件のテーブルすべてを参照可能</b>です。追加申請は不要です。"
},

{

  question:"取引モニタリングのアラートについて、部店別・月別の発生件数と、そのうち届出に至った割合、クローズまでの日数を見たいです。当局対応の資料に使いたいのですが可能でしょうか。",
  tags:[["AML/CFT","hl"],["取引モニタリング","hl"],["アラート","hl"],["当局対応",""],["部店別",""]],
  interp:{
    theme:"AML/CFT 取引モニタリング 運用状況モニタリング",
    conf:94,
    purpose:"当局report・第2線モニタリング資料の作成、検知シナリオの有効性評価",
    metrics:["アラート発生件数","真陽性率（SAR転化率）","SAR届出件数","平均クローズ日数","シナリオ別 誤検知率"],
    dims:["部店","月","検知シナリオ","顧客リスク格付","取引種類"],
    period:"直近24ヶ月"
  },
  gql:'<span class="r">MATCH</span> (t:<span class="n">AnalysisTheme</span> {id:<span class="v">"THM_AML_MONITORING_OPS"</span>})\n      -[:<span class="r">MEASURED_BY</span>]-&gt;(m:<span class="n">Metric</span>)-[:<span class="r">REQUIRES_ENTITY</span>]-&gt;(e)\n      -[:<span class="r">PHYSICALIZED_AS</span>]-&gt;(p:<span class="n">PhysicalTable</span>)\n<span class="r">MATCH</span> (p)-[:<span class="r">GOVERNED_BY</span>]-&gt;(rg:<span class="n">Regulation</span>)\n<span class="r">WHERE</span> rg.id <span class="r">IN</span> [<span class="v">"REG_AML"</span>,<span class="v">"REG_TIPPING_OFF"</span>]\n<span class="r">RETURN</span> p, rg.constraint   <span class="v">// 個票不可・集計のみ</span>',
  tiers:[
    {cap:"① 発話 ─ 業務語彙の抽出", rel:"", nodes:[{l:"業務部門の問い合わせ",s:"コンプラ統括部",k:"u"}]},
    {cap:"② is_about → 分析テーマ推定", rel:"is_about", nodes:[{l:"AML/CFT",s:"モニタリング運用",k:"t"}]},
    {cap:"③ measured_by → 分析指標", rel:"measured_by", nodes:[{l:"アラート件数",s:"Alert",k:"m"},{l:"SAR転化率",s:"True Pos.",k:"m"},{l:"クローズ日数",s:"TAT",k:"m"}]},
    {cap:"④ requires_entity → 業務エンティティ", rel:"requires_entity", nodes:[{l:"アラート",s:"Alert",k:"e"},{l:"調査ケース",s:"Case",k:"e"},{l:"届出",s:"SAR",k:"e"},{l:"部店",s:"Branch",k:"e"}]},
    {cap:"⑤ physicalized_as → 物理テーブル", rel:"physicalized_as", nodes:[{l:"M_ALERT_KPI_MTH",s:"MART_AML",k:"p"},{l:"M_CASE_TAT",s:"MART_AML",k:"p"},{l:"T_ALERT_HDR",s:"AML_SYS ✕",k:"p"}]}
  ],
  steps:[
    {t:"発話からの語彙抽出",d:"「取引モニタリング」「アラート」「届出」「クローズ」を抽出。AML業務オントロジーのプロセスモデルと照合。",sc:"4 terms"},
    {t:"業務オントロジーへのマッピング",d:"アラート → AMLプロセス:検知＞アラート。届出 → 疑わしい取引の届出（SAR）。犯収法の用語体系に接続。",sc:"0.97"},
    {t:"分析テーマの推定",d:"「モニタリング運用状況（第2線モニタリング）」と判定。顧客個別調査ではないため、集計マートで充足。",sc:"0.94"},
    {t:"規制制約の適用（governed_by）",d:"対象エンティティに REG_TIPPING_OFF（漏えい禁止）が紐づくため、<b>個票参照を自動で除外</b>し集計マートのみを提示。",sc:"制約適用"},
    {t:"エンティティ→物理テーブル解決",d:"AMLシステム本体の T_ALERT_HDR は個票を含むため候補から除外。KPIマート2件を推奨。",sc:"6→2"},
    {t:"アクセス可否の事前判定",d:"照会者ロール R_AML_OFFICER で集計マートは参照可能。個票は金融犯罪対策室の専用ロールが別途必要。",sc:"2 OK / 1 制限"}
  ],
  summary:"<b>「AML/CFT 取引モニタリングの運用状況分析」</b>と解釈しました。ご要望の3指標は <b>AML KPI月次マート</b>で充足します。なお、アラートの<b>個票（顧客・取引明細）は犯収法上の漏えい禁止（tipping-off）の観点から集計マート経由のみ</b>のご案内となります。",
  primary:[{
    rank:"最推奨", sys:"情報系DWH（コンプラ）", path:"DWH_CMP.MART_AML.M_ALERT_KPI_MTH",
    jname:"AML アラートKPI 月次マート",
    desc:"部店×シナリオ×月のアラート発生件数、クローズ件数、SAR転化件数を集計。顧客・取引の識別情報は含みません（k-匿名性を担保）。",
    attrs:[["YM","key"],["BRANCH_CD","key"],["SCENARIO_CD","key"],["ALERT_CNT",""],["CLOSED_CNT",""],["SAR_CNT",""],["FALSE_POS_CNT",""]],
    meta:[["粒度","部店 × シナリオ × 月"],["更新","月次／第5営業日"],["保有期間","84ヶ月（法定7年）"],["行数","約 21万"]]
  }],
  sup:[
    {sys:"情報系DWH（コンプラ）", path:"DWH_CMP.MART_AML.M_CASE_TAT", jname:"調査ケース TAT マート", desc:"ケース単位の受付〜クローズ所要日数の分布（中央値・90パーセンタイル）。担当者名は除去済。", join:"YM + BRANCH_CD"},
    {sys:"情報系DWH（コンプラ）", path:"DWH_CMP.MST.M_AML_SCENARIO", jname:"検知シナリオマスタ", desc:"シナリオ名称・閾値・適用開始日・想定リスク類型。シナリオ改定履歴を含む。", join:"SCENARIO_CD"}
  ],
  avoid:[
    {path:"AML_SYS.MON.T_ALERT_HDR / T_ALERT_DTL", jname:"AMLシステム アラート個票", reason:"犯収法の漏えい禁止（tipping-off）および内部規程により、金融犯罪対策室の調査担当ロール以外は参照不可。運用モニタリング目的では集計マートで充足します。"}
  ],
  cautions:[
    "<b>シナリオ改定の影響</b>にご注意ください。2025年11月にシナリオSC-014の閾値を変更しており、前後で件数の水準が不連続になります（M_AML_SCENARIO.VALID_FROM を確認）。",
    "<b>SAR転化率の分母</b>は「当月発生アラート」ではなく「当月クローズ分」で取るのが行内標準です。調査に数ヶ月かかるため、発生月基準では直近月が過小になります。",
    "<b>当局提出資料に使用する場合</b>は、金融犯罪対策室の管理職承認および数値の二者チェックが必要です（内部規程 AML-014）。"
  ],
  sql:'<span class="c">-- 部店別・月別 アラート件数 / SAR転化率 / 平均クローズ日数</span>\n<span class="k">SELECT</span> k.YM,\n       b.BRANCH_NM,\n       <span class="k2">SUM</span>(k.ALERT_CNT)                                   <span class="k">AS</span> ALERT_CNT,\n       <span class="k2">SUM</span>(k.SAR_CNT)                                     <span class="k">AS</span> SAR_CNT,\n       <span class="k2">ROUND</span>(<span class="k2">SUM</span>(k.SAR_CNT) / <span class="k2">NULLIF</span>(<span class="k2">SUM</span>(k.CLOSED_CNT),0) * 100, 2) <span class="k">AS</span> TRUE_POS_PCT,\n       <span class="k2">MAX</span>(t.TAT_MEDIAN_DAYS)                             <span class="k">AS</span> TAT_MEDIAN\n<span class="k">FROM</span>   DWH_CMP.MART_AML.M_ALERT_KPI_MTH k\n<span class="k">JOIN</span>   DWH_CMP.MST.M_AML_SCENARIO      s <span class="k">ON</span> s.SCENARIO_CD = k.SCENARIO_CD\n<span class="k">JOIN</span>   DWH_RTL.MST.M_BRANCH            b <span class="k">ON</span> b.BRANCH_CD   = k.BRANCH_CD\n<span class="k">LEFT JOIN</span> DWH_CMP.MART_AML.M_CASE_TAT   t <span class="k">ON</span> t.YM = k.YM <span class="k">AND</span> t.BRANCH_CD = k.BRANCH_CD\n<span class="k">WHERE</span>  k.YM &gt;= <span class="s">\'202409\'</span>\n<span class="k">GROUP BY</span> k.YM, b.BRANCH_NM\n<span class="k">ORDER BY</span> k.YM, ALERT_CNT <span class="k">DESC</span>;',
  gov:[["データオーナー","コンプライアンス統括部 金融犯罪対策室"],["データ分類","機密Ⅰ（規制情報・漏えい禁止）"],["申請手続","IDM ＞ DWH_CMP 参照権限（AML集計）"],["標準リードタイム","5営業日（データオーナー審査あり）"]],
  govnote:"照会者（渡辺さま）は<b>集計マートを参照可能</b>です。個票（T_ALERT_HDR）は現ロールでは参照できません。個別調査目的で必要な場合は、金融犯罪対策室 調査担当ロールの申請が必要です。"
}

const KCOLOR = {u:"#7d8ea3", t:"#123a63", m:"#0e8a7d", e:"#6a4fa3", p:"#b8760a", ok:"#1f8a4c", ng:"#c0392b"};
function renderKG(tiers){
  const W=392, PAD=8, GAP=9, NH=42, TGAP=40, CAPH=15;
  let y=12, nodes=[], edges=[], prev=[];
  tiers.forEach((tier,ti)=>{
    const capY=y; y+=CAPH;
    const n=tier.nodes.length;
    const nw=(W-PAD*2-GAP*(n-1))/n;
    const row=tier.nodes.map((nd,i)=>({...nd, x:PAD+i*(nw+GAP), y:y, w:nw, h:NH, tier:ti}));
    row.forEach(r=>nodes.push(r));
    if(prev.length) prev.forEach(p=>row.forEach(c=>edges.push([p,c,ti])));
    tier._capY=capY; tier._relY=capY;
    prev=row; y+=NH+TGAP;
  });
  const H=y-TGAP+14;
  let s='<svg class="kg" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
  edges.forEach(([a,b,ti])=>{
    const x1=a.x+a.w/2, y1=a.y+a.h, x2=b.x+b.w/2, y2=b.y;
    const my=(y1+y2)/2;
    const hot=(b.k==="p"||b.k==="ng"||b.k==="ok")?"":"";
    s+='<path class="edge e-t'+ti+' '+hot+'" d="M'+x1+' '+y1+' C'+x1+' '+my+' '+x2+' '+my+' '+x2+' '+y2+'"/>';
  });
  tiers.forEach((t,ti)=>{
    s+='<text class="cap" x="8" y="'+(t._capY+9)+'">'+esc(t.cap)+'</text>';
  });
  nodes.forEach(n=>{
    const c=KCOLOR[n.k]||"#7d8ea3";
    const fs = n.l.length>15 ? 7.6 : (n.l.length>11 ? 8.6 : 10);
    s+='<g class="node n-t'+n.tier+'"><title>'+esc(n.l+" / "+n.s)+'</title>'+
       '<rect x="'+n.x+'" y="'+n.y+'" width="'+n.w+'" height="'+n.h+'" fill="'+c+'" rx="5"/>'+
       '<text class="l" x="'+(n.x+n.w/2)+'" y="'+(n.y+18)+'" text-anchor="middle" font-size="'+fs+'">'+esc(n.l)+'</text>'+
       '<text class="s2" x="'+(n.x+n.w/2)+'" y="'+(n.y+31)+'" text-anchor="middle">'+esc(n.s)+'</text></g>';
  });
  return s+'</svg>';
}
function animateKG(root, tierCount){
  const g=root.querySelector("svg.kg"); if(!g) return;
  for(let i=0;i<tierCount;i++){
    setTimeout(()=>{
      g.querySelectorAll(".n-t"+i).forEach(e=>e.classList.add("on"));
      g.querySelectorAll(".e-t"+i).forEach(e=>e.classList.add("on"));
    }, 220*i+180);
  }
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
